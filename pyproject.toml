[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "execweave"
version = "0.2.0"
description = "Turn AI-agent runtime behavior into a graph-ready local event stream."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ExecWeave contributors" }
]
dependencies = [
  "psutil>=5.9",
  "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
execweave = "execweave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/execweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
