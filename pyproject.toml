[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "execweave"
version = "0.4.0"
description = "Turn AI-agent runtime behavior into a local interactive execution graph."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ExecWeave contributors" }
]
dependencies = [
  "psutil>=5.9",
  "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.16,<0.17",
]

[project.scripts]
execweave = "execweave.cli:main"
execweave-claude-hook = "execweave.claude_hook_cli:main"
execweave-claude-record = "execweave.claude_record:main"
execweave-codex-hook = "execweave.codex_hook_cli:main"
execweave-codex-record = "execweave.codex_record:main"

[tool.hatch.build.targets.wheel]
packages = ["src/execweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
