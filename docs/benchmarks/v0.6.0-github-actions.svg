<text x="430.0" y="558" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">20</text>
<line x1="590.0" y1="125" x2="590.0" y2="530" stroke="#e2e8f0" stroke-width="1"/>
<text x="590.0" y="558" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">30</text>
<line x1="750.0" y1="125" x2="750.0" y2="530" stroke="#e2e8f0" stroke-width="1"/>
<text x="750.0" y="558" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">40</text>
<line x1="910.0" y1="125" x2="910.0" y2="530" stroke="#e2e8f0" stroke-width="1"/>
