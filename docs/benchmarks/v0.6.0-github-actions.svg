<line x1="110" y1="530" x2="910" y2="530" stroke="#334155" stroke-width="1.5"/>
<line x1="110" y1="125" x2="110" y2="530" stroke="#334155" stroke-width="1.5"/>
<text x="510.0" y="595" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#334155">Additional peak process-tree RSS (MB) → higher</text>
<text x="32" y="327.5" transform="rotate(-90 32 327.5)" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#334155">Runtime overhead (%) → higher</text>
<circle cx="110.0" cy="530.0" r="8.0" fill="#64748b" fill-opacity="0.88" stroke="#ffffff" stroke-width="3"/>
<text x="126.0" y="512.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#0f172a">ExecWeave OFF</text>
<text x="126.0" y="531.0" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">+0.0 MB RSS · +0.0% time · 0.0 KB/run</text>
<circle cx="555.6" cy="503.4" r="28.0" fill="#2563eb" fill-opacity="0.88" stroke="#ffffff" stroke-width="3"/>
<text x="571.6" y="467.4" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Portable ON</text>
<text x="571.6" y="486.4" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">+27.9 MB RSS · +65.8% time · 741.4 KB/run</text>
<circle cx="712.4" cy="360.3" r="28.0" fill="#7c3aed" fill-opacity="0.88" stroke="#ffffff" stroke-width="3"/>
<text x="728.4" y="324.3" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Strace ON</text>
<text x="728.4" y="343.3" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#64748b">+37.7 MB RSS · +419.0% time · 572.8 KB/run</text>
<text x="110" y="622" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#94a3b8">Bubble area ≈ median residual artifact size per run · Package footprint: 848.7 KB (ExecWeave files only)</text>
</svg>
