<line x1="110" y1="449.0" x2="910" y2="449.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="92" y="453.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">200</text>
<line x1="110" y1="530.0" x2="910" y2="530.0" stroke="#e2e8f0" stroke-width="1"/>
