<line x1="110" y1="125.0" x2="910" y2="125.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="92" y="129.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">1000</text>
<line x1="110" y1="206.0" x2="910" y2="206.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="92" y="210.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">800</text>
<line x1="110" y1="287.0" x2="910" y2="287.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="92" y="291.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">600</text>
<line x1="110" y1="368.0" x2="910" y2="368.0" stroke="#e2e8f0" stroke-width="1"/>
