name: Windows Suite Diagnosis

# Manual, bounded diagnostic of the full test collection in one pytest process on
# Windows. It is never triggered automatically; ordinary CI still tests every head.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to diagnose (defaults to the dispatched ref)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: windows-diagnosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      EXECWEAVE_E2E_REQUIRED: '1'
    steps:
      - name: Check out diagnostic tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic-tools
          persist-credentials: false
      - name: Check out unchanged product source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the product using the normal project requirements
        working-directory: candidate
        run: |
          python -m pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Capture product source fingerprint
        working-directory: candidate
        shell: pwsh
        run: |
          python scripts/acceptance_source_provenance.py --output "$env:GITHUB_WORKSPACE/windows-source-before.json"
          exit $LASTEXITCODE
      - name: Diagnose the full test collection in one pytest process
        working-directory: candidate
        shell: pwsh
        run: |
          python ../diagnostic-tools/scripts/diagnose_pytest.py --output "$env:GITHUB_WORKSPACE/windows-suite-evidence" --budget 1500 --stack-interval 120
          exit $LASTEXITCODE
      - name: Confirm product source stayed unchanged
        if: always()
        working-directory: candidate
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE/windows-source-before.json") {
            python scripts/acceptance_source_provenance.py --output "$env:GITHUB_WORKSPACE/windows-source-after.json" --compare "$env:GITHUB_WORKSPACE/windows-source-before.json"
            exit $LASTEXITCODE
          }
          throw 'No pre-run source fingerprint; source invariance is unverified'
      - name: Upload partial diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-diagnostic-py312
          path: |
            windows-suite-evidence/
            windows-source-before.json
            windows-source-after.json
          if-no-files-found: error
          retention-days: 7
