name: One-time workflow run cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-workflow-runs.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for other workflow runs to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current = int(os.environ["CURRENT_RUN_ID"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_runs(status):
              url = f"https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response).get("workflow_runs", [])

          statuses = ("queued", "in_progress", "waiting", "requested", "pending")
          deadline = time.time() + 20 * 60
          while True:
              active = []
              for status in statuses:
                  active.extend(run for run in get_runs(status) if int(run["id"]) != current)
              unique = {int(run["id"]): run for run in active}
              if not unique:
                  print("No other active workflow runs remain.")
                  break
              print(f"Waiting for {len(unique)} other workflow run(s) to finish...")
              if time.time() >= deadline:
                  raise SystemExit("Timed out waiting for other workflow runs to finish")
              time.sleep(10)
          PY

      - name: Delete all completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deleted = 0

          def completed_runs():
              url = f"https://api.github.com/repos/{repo}/actions/runs?status=completed&per_page=100"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response).get("workflow_runs", [])

          while True:
              runs = completed_runs()
              if not runs:
                  break
              print(f"Deleting batch of {len(runs)} completed workflow run(s)...")
              for run in runs:
                  run_id = int(run["id"])
                  url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
                  req = urllib.request.Request(url, method="DELETE", headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          if response.status != 204:
                              raise RuntimeError(f"Unexpected status {response.status} deleting run {run_id}")
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          continue
                      raise
                  deleted += 1
                  time.sleep(0.12)

          print(f"Deleted {deleted} completed workflow run(s).")
          PY

      - name: Remove one-time cleanup workflow from main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/cleanup-workflow-runs.yml ]; then
            git rm .github/workflows/cleanup-workflow-runs.yml
            git commit -m "chore: remove one-time workflow cleanup [skip ci]"
            git push origin HEAD:main
          fi
