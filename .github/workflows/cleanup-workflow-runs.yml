name: Cleanup workflow runs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-workflow-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          current_sha = os.environ["CURRENT_SHA"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ExecWeave-workflow-run-cleanup",
          }

          def request(method, path):
              req = urllib.request.Request(api + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {body}") from exc

          def get_all_runs():
              runs = []
              page = 1
              while True:
                  _, payload = request("GET", f"/actions/runs?per_page=100&page={page}")
                  batch = payload["workflow_runs"]
                  runs.extend(batch)
                  if len(batch) < 100:
                      return runs
                  page += 1

          initial = get_all_runs()
          print(f"Initial workflow runs: {len(initial)}")
          print(f"Preserving current cleanup run: {current_run_id}")

          deadline = time.time() + 1200
          while True:
              runs = get_all_runs()
              siblings = [
                  r for r in runs
                  if r["id"] != current_run_id
                  and r.get("head_sha") == current_sha
                  and r.get("status") != "completed"
              ]
              if not siblings:
                  break
              if time.time() >= deadline:
                  raise SystemExit(
                      "Timed out waiting for sibling runs to finish: "
                      + str([(r["id"], r["name"], r["status"]) for r in siblings])
                  )
              print("Waiting for sibling runs:", [(r["id"], r["name"], r["status"]) for r in siblings])
              time.sleep(10)

          runs = get_all_runs()
          targets = [
              r for r in runs
              if r["id"] != current_run_id and r.get("status") == "completed"
          ]
          print(f"Deleting {len(targets)} completed workflow run(s).")
          for r in targets:
              print(f"Deleting run {r['id']} {r['name']!r} conclusion={r.get('conclusion')!r}")
              request("DELETE", f"/actions/runs/{r['id']}")

          remaining = get_all_runs()
          completed_others = [
              r for r in remaining
              if r["id"] != current_run_id and r.get("status") == "completed"
          ]
          if completed_others:
              raise SystemExit(
                  "Cleanup incomplete; completed runs remain: "
                  + str([(r["id"], r["name"]) for r in completed_others])
              )
          if not any(r["id"] == current_run_id for r in remaining):
              raise SystemExit("Safety failure: current cleanup run disappeared")

          print(f"Deleted completed runs: {len(targets)}")
          print(f"Remaining workflow runs while cleanup is active: {len(remaining)}")
          PY
