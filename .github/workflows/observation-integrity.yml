name: Observation Integrity

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/observation-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observation-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-reviewed-patch:
    name: Materialize checksum-pinned local edits (never publish)
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'Irish-kw/ExecWeave' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/observation-integrity-0.8.35'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Check exact parent, data, preimages, and postimages
        shell: bash
        env:
          EXPECTED_PARENT: aaaca9b4c35037fd6008d032f9f4aac19de5de77
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python - <<'PY'
          import ast
          import hashlib
          import subprocess
          from pathlib import Path

          expected = {
              'stage1-1.literal': 'e50a21b94cd827ea295253b3d3e919fc4029700a',
              'stage1-2.literal': '0649dcadd5fdd779846e4ea56a7a639a48af005b',
              'stage1-3.literal': '7fc48ebe60889123378fbcddae2451257f03d68c',
              'stage1-4.literal': 'e17cdacd56a45c69e124f357dbcec03967259737',
          }
          added = {
              'CHANGELOG.md': '4b25bbe98e773a9d04feaca55c76ba958ce44747',
              'docs/observation-integrity.md': '30c270a77fdfced82cbc2304aabc37020dba7639',
              'src/execweave/hook_command.py': '003343b8b0519cab584f2f3062ae173966e2466c',
              'src/execweave/hook_delivery.py': '10bb88585fbe9cff3e7de94bec8be112ebbcce15',
              'src/execweave/observation.py': '6e19c81b795df15f43b386cb69ae17066afdf706',
              'src/execweave/observation_demo.py': '9aa317f3520c99467dabab3ce367ecdd1b20835b',
              'tests/test_observation_integrity_0835.py': '2d4bc8e899da8815df9cafd91a76cb8760edd80f',
          }
          def blob(path):
              return subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          outputs = {}
          for name, digest in added.items():
              assert blob(name) == digest, ('new_file_mismatch', name)
          for name, digest in expected.items():
              transport = Path('scripts/maintenance') / name
              assert blob(transport) == digest, ('transport_mismatch', name)
              assert transport.stat().st_size < 100000
              for row in ast.literal_eval(transport.read_text(encoding='utf-8')):
                  path = Path(row['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert str(path).startswith(('src/execweave/', 'tests/')) or str(path) in {'README.md', 'README.zh-TW.md'}
                  assert not path.is_symlink() and path.is_file() and path not in outputs
                  raw = path.read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == row['before_sha256'], ('preimage', str(path))
                  text = raw.decode('utf-8')
                  end_bound = len(text)
                  for start, end, replacement in reversed(row['edits']):
                      assert type(start) is int and type(end) is int and isinstance(replacement, str)
                      assert 0 <= start <= end <= end_bound
                      text = text[:start] + replacement + text[end:]
                      end_bound = start
                  raw = text.encode('utf-8')
                  assert hashlib.sha256(raw).hexdigest() == row['after_sha256'], ('postimage', str(path))
                  outputs[path] = raw
          assert len(outputs) == 20
          # Only data is parsed above. No candidate product/test code runs with write credentials.
          for path, raw in outputs.items():
              path.write_bytes(raw)
              print('VERIFIED_POSTIMAGE', path, hashlib.sha256(raw).hexdigest())
          PY
      - name: Commit only the validated source edits and remove transfer data
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/maintenance/stage1-1.literal scripts/maintenance/stage1-2.literal scripts/maintenance/stage1-3.literal scripts/maintenance/stage1-4.literal
          git add README.md README.zh-TW.md src/execweave tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: persist observation gaps and explicit rootless hook setup (stage 1)'
          git push origin HEAD:refs/heads/fix/observation-integrity-0.8.35
          git rev-parse HEAD

  review-source:
    name: Export exact review source (not release acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Export tracked review material
        shell: bash
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/SOURCE_SHA.txt
          git archive --format=zip --output=review-artifacts/source.zip HEAD
          sha256sum review-artifacts/source.zip > review-artifacts/SHA256SUMS
          printf '%s\n' 'SOURCE_EXPORT_ONLY=true' 'RELEASE_ACCEPTANCE=NOT_RUN' > review-artifacts/status.txt
      - name: Prepare offline test dependencies
        run: |
          python -m pip download --only-binary=:all: --dest review-artifacts/wheels watchdog hatchling build 'ruff>=0.16,<0.17'
      - uses: actions/upload-artifact@v4
        with:
          name: observation-review-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: review-artifacts/
          if-no-files-found: error
          retention-days: 14
