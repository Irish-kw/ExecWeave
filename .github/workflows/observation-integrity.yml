name: Observation Integrity

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/observation-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observation-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-source:
    name: Export source archive and offline test dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Export tracked source archive
        shell: bash
        run: |
          mkdir -p source-export
          git rev-parse HEAD > source-export/SOURCE_SHA.txt
          git archive --format=zip --output=source-export/source.zip HEAD
          sha256sum source-export/source.zip > source-export/SHA256SUMS
          printf '%s\n' 'SOURCE_EXPORT_ONLY=true' > source-export/status.txt
      - name: Prepare offline test dependencies
        run: |
          python -m pip download --only-binary=:all: --dest source-export/wheels watchdog hatchling build 'ruff>=0.16,<0.17'
      - uses: actions/upload-artifact@v4
        with:
          name: observation-source-archive-${{ github.event.pull_request.head.sha || github.sha }}
          path: source-export/
          if-no-files-found: error
          retention-days: 14
