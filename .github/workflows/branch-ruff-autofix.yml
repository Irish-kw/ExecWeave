name: Branch Ruff Autofix

on:
  push:
    branches:
      - feat/full-agent-trace

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-agent-trace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.16,<0.17'
      - run: ruff check --fix src/execweave/codex_rollout_trace.py
      - name: Commit exact autofix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/execweave/codex_rollout_trace.py
          git commit -m 'fix: remove rollout trace lint error'
          git push origin HEAD:feat/full-agent-trace
