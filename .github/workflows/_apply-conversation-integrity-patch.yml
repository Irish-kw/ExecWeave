name: Apply conversation integrity patch

on:
  push:
    branches:
      - fix/antigravity-real-transcript-history
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-conversation-integrity-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/antigravity-real-transcript-history
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev,e2e]'

      - name: Correct verified owner guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_apply_conversation_integrity_patch.py')
          text = path.read_text(encoding='utf-8')
          old = 'if text.count("source=_agent(),") != 3:\n    raise SystemExit("antigravity_full_fidelity_base.py: expected three _agent() source calls")'
          new = 'if text.count("source=_agent(),") != 2:\n    raise SystemExit("antigravity_full_fidelity_base.py: expected two _agent() source calls")'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply guarded patch
        run: python scripts/_apply_conversation_integrity_patch.py

      - name: Normalize generated literals and root publication scope
        run: |
          python - <<'PY'
          from pathlib import Path

          preview_path = Path('src/execweave/conversation_preview.py')
          preview = preview_path.read_text(encoding='utf-8')
          old_regex = r'r"<USER_REQUEST>\\s*(?P<body>.*?)\\s*</USER_REQUEST>"'
          new_regex = r'r"<USER_REQUEST>\s*(?P<body>.*?)\s*</USER_REQUEST>"'
          assert preview.count(old_regex) == 1
          preview_path.write_text(preview.replace(old_regex, new_regex), encoding='utf-8')

          test_path = Path('tests/test_provider_conversation_history_integrity.py')
          tests = test_path.read_text(encoding='utf-8')
          assert r'\\n' in tests
          test_path.write_text(tests.replace(r'\\n', r'\n'), encoding='utf-8')

          records_path = Path('src/execweave/conversation_records.py')
          records = records_path.read_text(encoding='utf-8')

          start = records.index('def _ollama_current_turn(preview: dict[str, Any]) -> None:\n')
          end = records.index('def _ollama_root_agent_id(', start)
          current_turn = '''def _ollama_current_turn(preview: dict[str, Any]) -> None:\n    """Reduce a cumulative Ollama chat request to the exact turn this exchange created."""\n    messages = [message for message in preview.get("messages") or [] if isinstance(message, dict)]\n    users = [\n        message\n        for message in messages\n        if message.get("sender") == "user"\n        and message.get("content_role") == "ollama_request_surface"\n    ]\n    response_assistants = [\n        message\n        for message in messages\n        if message.get("content_role") == "ollama_response_surface"\n        and str(message.get("kind") or "").startswith("assistant")\n    ]\n    if not users:\n        return\n    current = [users[-1]]\n    if response_assistants:\n        current.append(response_assistants[-1])\n    preview["message_count"] = len(current)\n    preview["messages_truncated"] = False\n    preview["messages"] = current\n\n\n'''
          records = records[:start] + current_turn + records[end:]

          marker = '''    snapshots: list[tuple[dict[str, Any], dict[str, Any]]] = []\n'''
          tagger = '''    # Preserve which side of an Ollama exchange produced each visible message.\n    # Cumulative request.messages can contain historical assistant text, so publication\n    # must select the assistant observed on the response surface rather than guessing\n    # from list position.\n    for entry in entries:\n        if str(entry.get("provider") or "").lower() != "ollama":\n            continue\n        preview = entry.get("conversation_preview")\n        if not isinstance(preview, dict):\n            continue\n        kind = str(entry.get("content_kind") or "").lower()\n        relation = str(entry.get("relation") or "").upper()\n        if "assistant_messages" in kind or relation == "OBSERVED_ASSISTANT_MESSAGES":\n            role = "ollama_response_surface"\n        elif "request_messages" in kind or "request_prompt" in kind or "request_input" in kind:\n            role = "ollama_request_surface"\n        else:\n            continue\n        for message in preview.get("messages") or []:\n            if isinstance(message, dict):\n                message["content_role"] = role\n\n'''
          assert records.count(marker) == 1
          records = records.replace(marker, tagger + marker, 1)

          old = '''        _ollama_current_turn(preview)\n        original_source_id = entry.get("source_id")\n'''
          new = '''        _ollama_current_turn(preview)\n        preview["provider_native_id"] = root_id\n        original_source_id = entry.get("source_id")\n'''
          assert records.count(old) == 1
          records_path.write_text(records.replace(old, new), encoding='utf-8')
          PY

      - name: Ruff
        run: python -m ruff check .

      - name: Focused non-browser regressions
        run: python -m pytest -q tests/test_provider_conversation_history_integrity.py -m 'not viewer_e2e'

      - name: Full non-browser suite
        run: python -m pytest -q -m 'not viewer_e2e'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Required browser regressions
        env:
          EXECWEAVE_E2E_REQUIRED: '1'
        run: python -m pytest -v tests/test_provider_conversation_history_integrity.py -m viewer_e2e

      - name: Commit production and permanent tests
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/execweave/conversation_preview.py \
            src/execweave/conversation_records.py \
            src/execweave/antigravity_full_fidelity_base.py \
            src/execweave/model_runtime.py \
            src/execweave/model_runtime_full_fidelity.py \
            src/execweave/auto_specialized.py \
            src/execweave/collector.py \
            src/execweave/strace_backend.py \
            src/execweave/viewer_dashboard_focus.py \
            src/execweave/viewer_agent_panel.py \
            tests/test_provider_conversation_history_integrity.py
          git commit -m 'fix: preserve provider conversation history'
          git push origin HEAD:fix/antigravity-real-transcript-history
