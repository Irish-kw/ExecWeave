name: One-time live support README sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-live-support-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update live support matrix
        run: python scripts/update_readme_live_support_matrix.py
      - name: Commit README updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-TW.md README.zh-CN.md README.ja.md README.ko.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: clarify live integration coverage"
          git push origin HEAD:main
