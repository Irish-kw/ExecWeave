name: Sync v0.6.3 README

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-v063.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize five README languages
        run: python scripts/sync_readme_v063.py
      - name: Commit README updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-TW.md README.zh-CN.md README.ja.md README.ko.md
          if git diff --cached --quiet; then
            echo "README files already synchronized"
            exit 0
          fi
          git commit -m "docs: sync v0.6.3 README features"
          git push origin HEAD:main
