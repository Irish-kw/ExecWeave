name: Release 0.8.3 Version Sync

on:
  push:
    branches:
      - release/0.8.3-version-bump

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.3-version-bump
          fetch-depth: 0
      - name: Sync current release anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          readmes = [Path("README.md"), *sorted(Path(".").glob("README.*.md"))]
          for path in readmes:
              text = path.read_text(encoding="utf-8")
              text = text.replace("v0.8.2", "v0.8.3")
              path.write_text(text, encoding="utf-8")

          path = Path("tests/test_v069_dashboard_release.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('assert __version__ == "0.8.2"', 'assert __version__ == "0.8.3"')
          text = text.replace('version = \\"0.8.2\\"', 'version = \\"0.8.3\\"')
          text = text.replace("ExecWeave v0.8.2 release metadata", "ExecWeave v0.8.3 release metadata")
          path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README*.md tests/test_v069_dashboard_release.py
          git commit -m "docs: sync 0.8.3 release anchors"
          git push origin HEAD:release/0.8.3-version-bump
