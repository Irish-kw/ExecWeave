name: Sync v0.6.4 live matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-v064-live-matrix.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make section boundary language independent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/sync_v064_live_matrix.py")
          text = path.read_text(encoding="utf-8")
          old = '''    scale = text.find("#### Scalability", start)\n    if scale < 0:\n        raise RuntimeError("Scalability heading not found")\n    return text[:start] + section.rstrip() + "\\n\\n" + text[scale:]\n'''
          new = '''    benchmark = text.find("\\n#### ", start)\n    if benchmark < 0:\n        raise RuntimeError("benchmark heading not found")\n    benchmark += 1\n    return text[:start] + section.rstrip() + "\\n\\n" + text[benchmark:]\n'''
          if old not in text:
              raise SystemExit("expected synchronizer block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Synchronize live capability matrix
        run: python scripts/sync_v064_live_matrix.py
      - name: Remove one-time synchronizer and commit
        run: |
          rm scripts/sync_v064_live_matrix.py
          rm .github/workflows/sync-v064-live-matrix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md README.zh-TW.md README.zh-CN.md README.ja.md README.ko.md README.fr.md README.de.md README.ru.md scripts/sync_v064_live_matrix.py .github/workflows/sync-v064-live-matrix.yml
          if git diff --cached --quiet; then
            echo "README files already synchronized"
            exit 0
          fi
          git commit -m "docs: sync v0.6.4 automatic live integrations"
          git push origin HEAD:main
