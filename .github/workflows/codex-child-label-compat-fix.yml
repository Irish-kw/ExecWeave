name: Preserve Codex child-label compatibility seam

on:
  push:
    branches:
      - fix/0.8.32-audit-closure-materialized

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'Bootstrap Codex child-label compatibility fixer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compatibility-preserving child label expression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b6a10b8ad79066d9b9fa7c79025cfe37e5df6e4d"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/execweave/viewer_agent_panel.py')
          text = path.read_text(encoding='utf-8')
          old = "const naming=round=>{if(isRoot||round.label)return round;const parentRound=roundOf(round.start,runs);return{start:parentRound?.start||round.start,label:''}};"
          new = "const naming=round=>isRoot?round:(round.label?round:(()=>{const parentRound=roundOf(round.start,runs);return{start:parentRound?.start||round.start,label:''}})());"
          if text.count(old) != 1:
              raise SystemExit(f'child naming compatibility seam count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/codex-child-label-compat-fix.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Focused Codex and Antigravity regressions
        run: |
          python -m pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium
          python -m pytest -q tests/test_codex_child_panel_policy.py::test_codex_child_fold_does_not_reuse_root_user_prompt
          xvfb-run -a python -m pytest -q tests/test_antigravity_multi_conversation_isolation.py::test_antigravity_two_round_eight_child_dashboard_isolation_and_fold_state
          ruff check src/execweave/viewer_agent_panel.py

      - name: Commit compatibility seam
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ExecWeave Codex compatibility fixer'
          git config user.email '49675917+Irish-kw@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve Codex child label compatibility seam'
          git push origin HEAD:fix/0.8.32-audit-closure-materialized
