name: Apply Ollama serve runtime hotfix

on:
  push:
    branches:
      - fix/ollama-serve-windows-finalization

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ollama-serve-windows-finalization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded patch
        run: python scripts/apply_ollama_serve_hotfix.py
      - name: Validate patch
        run: |
          python -m compileall -q src tests/test_ollama_serve_runtime_integration.py
          git diff --check
      - name: Commit source changes
        run: |
          rm scripts/apply_ollama_serve_hotfix.py
          rm .github/workflows/apply-ollama-serve-hotfix.yml
          git config user.name "GWW"
          git config user.email "49675917+Irish-kw@users.noreply.github.com"
          git add -A
          git commit -m "Fix Ollama serve capture and Ctrl+C finalization"
          git push origin HEAD:fix/ollama-serve-windows-finalization
