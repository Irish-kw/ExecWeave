name: Verify ExecWeave 0.8.16 on public PyPI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release-0.8.16.yml

permissions:
  contents: read

jobs:
  verify-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact public PyPI version in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/execweave-pypi-0816
          /tmp/execweave-pypi-0816/bin/python -m pip install --upgrade pip
          /tmp/execweave-pypi-0816/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple "execweave==0.8.16"
          /tmp/execweave-pypi-0816/bin/python - <<'PY'
          import importlib.metadata
          import pathlib
          import execweave

          expected = "0.8.16"
          dist_version = importlib.metadata.version("execweave")
          runtime_version = execweave.__version__
          module_path = pathlib.Path(execweave.__file__).resolve()
          print(f"DIST_VERSION={dist_version}")
          print(f"RUNTIME_VERSION={runtime_version}")
          print(f"MODULE_PATH={module_path}")
          if dist_version != expected or runtime_version != expected:
              raise SystemExit(
                  f"public PyPI version mismatch: dist={dist_version!r} runtime={runtime_version!r} expected={expected!r}"
              )
          if not str(module_path).startswith("/tmp/execweave-pypi-0816/"):
              raise SystemExit(f"unexpected module source: {module_path}")
          print("PUBLIC_PYPI_EXACT_INSTALL=PASS")
          PY
          /tmp/execweave-pypi-0816/bin/python -m pip show execweave
          /tmp/execweave-pypi-0816/bin/execweave --help >/dev/null
          echo "PUBLIC_PYPI_CLI_SMOKE=PASS"
