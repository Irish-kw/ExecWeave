name: Fix viewer fold state and initial readability

on:
  push:
    branches:
      - fix/0.8.32-audit-closure-materialized

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'Bootstrap viewer state/readability fixer'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXECWEAVE_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply viewer fixes on exact audited parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "29ebbe7bf77c00491e4d378203d0b38d8a64d3d2"
          python - <<'PY'
          from pathlib import Path

          fold_path = Path('src/execweave/viewer_fold_state.py')
          text = fold_path.read_text(encoding='utf-8')
          old = "function foldScope(node){const graph=window.__execweaveCore?.getGraph?.()||window.__execweaveStaticGraph||{};const session=String(graph.session_id||'');return session?`execweave:folds:v1:${foldHash(session)}:${foldHash(agentKey(node))}`:null}\nfunction foldStateFor(node){\n  const scope=foldScope(node),key=scope||`volatile:${agentKey(node)}`;\n  let state=foldStateByAgent.get(key);if(state)return state;\n  state=new Map();\n  if(scope)try{const data=JSON.parse(localStorage.getItem(scope)||'null');if(data&&data.version===1&&Array.isArray(data.folds))for(const pair of data.folds.slice(-4096)){if(Array.isArray(pair)&&typeof pair[0]==='string'&&typeof pair[1]==='boolean')Map.prototype.set.call(state,pair[0],pair[1])}}catch(_){}\n  const get=state.get.bind(state),has=state.has.bind(state),set=state.set.bind(state);\n  state.get=raw=>get(foldHash(raw));state.has=raw=>has(foldHash(raw));\n  state.set=(raw,value)=>{set(foldHash(raw),Boolean(value));while(state.size>4096)state.delete(state.keys().next().value);if(scope)try{localStorage.setItem(scope,JSON.stringify({version:1,folds:[...state]}))}catch(_){}return state};\n  foldStateByAgent.set(key,state);return state;\n}"
          new = "function foldScope(node){const coreGraph=window.__execweaveCore?.getGraph?.()||{},staticGraph=window.__execweaveStaticGraph||{},identity=String(coreGraph.session_id||staticGraph.session_id||coreGraph.source_path||staticGraph.source_path||'');return identity?`execweave:folds:v1:${foldHash(identity)}:${foldHash(agentKey(node))}`:null}\nfunction foldStateFor(node){\n  const scope=foldScope(node),key=`agent:${foldHash(agentKey(node))}`;\n  let state=foldStateByAgent.get(key);\n  if(state){if(scope)state.__execweaveScope=scope;return state}\n  state=new Map();state.__execweaveScope=scope||null;\n  if(scope)try{const data=JSON.parse(localStorage.getItem(scope)||'null');if(data&&data.version===1&&Array.isArray(data.folds))for(const pair of data.folds.slice(-4096)){if(Array.isArray(pair)&&typeof pair[0]==='string'&&typeof pair[1]==='boolean')Map.prototype.set.call(state,pair[0],pair[1])}}catch(_){}\n  const get=state.get.bind(state),has=state.has.bind(state),set=state.set.bind(state);\n  state.get=raw=>get(foldHash(raw));state.has=raw=>has(foldHash(raw));\n  state.set=(raw,value)=>{set(foldHash(raw),Boolean(value));while(state.size>4096)state.delete(state.keys().next().value);const activeScope=state.__execweaveScope;if(activeScope)try{localStorage.setItem(activeScope,JSON.stringify({version:1,folds:[...state]}))}catch(_){}return state};\n  foldStateByAgent.set(key,state);return state;\n}"
          if text.count(old) != 1:
              raise SystemExit(f'fold-state function seam count={text.count(old)}')
          text = text.replace(old, new)
          old = "  fold.addEventListener('click',event=>{if(event.target.closest?.('summary')?.parentElement===fold)touched=true});"
          new = "  fold.addEventListener('click',event=>{if(event.target.closest?.('summary')?.parentElement===fold){touched=true;state.set(key,!fold.open)}});"
          if text.count(old) != 1:
              raise SystemExit(f'fold click seam count={text.count(old)}')
          fold_path.write_text(text.replace(old, new), encoding='utf-8')

          panel_path = Path('src/execweave/viewer_agent_panel.py')
          text = panel_path.read_text(encoding='utf-8')
          old = "const fold=document.createElement('details');fold.className=defaultOpen?'execweave-agent-latest':'execweave-agent-older';"
          new = "const fold=document.createElement('details');fold.className=defaultOpen?'execweave-agent-latest execweave-agent-round':'execweave-agent-older';"
          if text.count(old) != 1:
              raise SystemExit(f'latest round class seam count={text.count(old)}')
          text = text.replace(old, new)
          old = "const naming=round=>isRoot?round:(round.label?round:(roundOf(round.start,runs)||{start:round.start,label:''}));"
          new = "const naming=round=>{if(isRoot||round.label)return round;const parentRound=roundOf(round.start,runs);return{start:parentRound?.start||round.start,label:''}};"
          if text.count(old) != 1:
              raise SystemExit(f'child naming seam count={text.count(old)}')
          panel_path.write_text(text.replace(old, new), encoding='utf-8')

          shell_path = Path('src/execweave/dashboard_shell.py')
          text = shell_path.read_text(encoding='utf-8')
          old = '        "if(!hasFitted&&positions.size){fit(false);hasFitted=true}",\n'
          new = '        "if(!hasFitted&&positions.size){fit(false,.48);hasFitted=true}",\n'
          if text.count(old) != 1:
              raise SystemExit(f'initial-readable replacement seam count={text.count(old)}')
          shell_path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/viewer-state-readability-fix.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test environment
        run: |
          python -m pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium

      - name: Focused viewer regressions
        shell: bash
        run: |
          xvfb-run -a python -m pytest -q \
            tests/test_antigravity_history_replay.py::test_antigravity_history_survives_new_stop_and_manual_fold_state_in_chromium \
            tests/test_antigravity_multi_conversation_isolation.py::test_antigravity_two_round_eight_child_dashboard_isolation_and_fold_state \
            tests/test_audit_closure_viewer_20260917.py::test_real_storage_survives_reload_and_is_isolated_by_run \
            tests/test_dashboard_initial_fit_readability_e2e.py::test_dense_initial_view_keeps_agents_readable_and_fit_remains_available \
            tests/test_dashboard_round_fold_state_e2e.py::test_round_fold_state_survives_live_polling_payload_changes_and_agent_switches \
            tests/test_session_execution_flow.py::test_browser_session_flow_and_collapsed_incoming_history
          ruff check src/execweave/viewer_fold_state.py src/execweave/viewer_agent_panel.py src/execweave/dashboard_shell.py

      - name: Commit focused source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ExecWeave viewer regression fixer'
          git config user.email '49675917+Irish-kw@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve viewer fold state and readable initial camera'
          git push origin HEAD:fix/0.8.32-audit-closure-materialized
