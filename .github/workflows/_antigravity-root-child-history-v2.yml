name: Antigravity root child history v2

on:
  push:
    branches:
      - fix/antigravity-root-child-history-v2

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/antigravity-root-child-history-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded patch
        run: |
          python .github/_tmp_antigravity_root_child_history_v2.py
          python .github/_tmp_antigravity_root_child_history_v2_fix.py
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Focused non-browser regressions
        run: python -m pytest -q tests/test_antigravity_root_child_history_v2.py tests/test_antigravity_subagent_transcript_linkage.py tests/test_antigravity_linkage_projection.py tests/test_antigravity_multi_conversation_isolation.py tests/test_provider_conversation_history_integrity.py -m "not viewer_e2e"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Required new browser regression
        env:
          EXECWEAVE_E2E_REQUIRED: "1"
        run: python -m pytest -q tests/test_antigravity_root_child_history_v2.py -m viewer_e2e
      - name: Full Viewer regressions
        env:
          EXECWEAVE_E2E_REQUIRED: "1"
        run: python -m pytest -q -m viewer_e2e
      - name: Full non-browser suite
        run: python -m pytest -q -m "not viewer_e2e"
      - name: Commit validated patch and remove scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/_tmp_antigravity_root_child_history_v2.py .github/_tmp_antigravity_root_child_history_v2_fix.py .github/workflows/_antigravity-root-child-history-v2.yml
          git add src/execweave/antigravity_subagent_linkage.py src/execweave/conversation_records.py src/execweave/viewer_agent_panel.py src/execweave/viewer_dashboard_focus.py tests/test_antigravity_root_child_history_v2.py
          git diff --cached --check
          git commit -m "fix: preserve Antigravity root and child task history"
          git push origin HEAD:fix/antigravity-root-child-history-v2
