name: Antigravity root child history v2

on:
  push:
    branches:
      - fix/antigravity-root-child-history-v2

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/antigravity-root-child-history-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded patch
        run: python .github/_tmp_antigravity_root_child_history_v2.py
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Dump Antigravity conversation records
        run: |
          python - <<'PY'
          import json
          import runpy
          import tempfile
          from pathlib import Path
          from execweave.conversation_records import conversation_record_entries
          ns = runpy.run_path('tests/test_antigravity_root_child_history_v2.py')
          graph, run_root = ns['_build'](Path(tempfile.mkdtemp()))
          entries = conversation_record_entries(graph, run_root)
          for entry in entries:
              if str(entry.get('provider') or '').lower() != 'antigravity':
                  continue
              preview = entry.get('conversation_preview') or {}
              print(json.dumps({
                  'source_id': entry.get('source_id'),
                  'content_kind': entry.get('content_kind'),
                  'relation': entry.get('relation'),
                  'agent_path': preview.get('agent_path'),
                  'parent_agent_path': preview.get('parent_agent_path'),
                  'parent_scope_id': preview.get('parent_scope_id'),
                  'messages': preview.get('messages'),
              }, ensure_ascii=False))
          PY
      - name: Focused non-browser regressions
        run: python -m pytest -q tests/test_antigravity_root_child_history_v2.py tests/test_antigravity_subagent_transcript_linkage.py tests/test_antigravity_linkage_projection.py tests/test_antigravity_multi_conversation_isolation.py tests/test_provider_conversation_history_integrity.py -m "not viewer_e2e"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Required new browser regression
        env:
          EXECWEAVE_E2E_REQUIRED: "1"
        run: python -m pytest -q tests/test_antigravity_root_child_history_v2.py -m viewer_e2e
      - name: Full Viewer regressions
        env:
          EXECWEAVE_E2E_REQUIRED: "1"
        run: python -m pytest -q -m viewer_e2e
      - name: Full non-browser suite
        run: python -m pytest -q -m "not viewer_e2e"
      - name: Commit validated patch and remove scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/_tmp_antigravity_root_child_history_v2.py .github/workflows/_antigravity-root-child-history-v2.yml
          git add src/execweave/antigravity_subagent_linkage.py src/execweave/conversation_preview.py src/execweave/conversation_records.py src/execweave/viewer_agent_panel.py src/execweave/viewer_dashboard_focus.py tests/test_antigravity_root_child_history_v2.py
          git diff --cached --check
          git commit -m "fix: preserve Antigravity root and child task history"
          git push origin HEAD:fix/antigravity-root-child-history-v2
