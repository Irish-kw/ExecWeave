name: Dispatch ExecWeave 0.8.15 Trusted Publishing

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release-0.8.15.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b157b6a5e5491260051198cea11e5505bbdd38c0
          fetch-depth: 0

      - name: Verify exact validated release and version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.8.15
          TARGET_SHA: b157b6a5e5491260051198cea11e5505bbdd38c0
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          expected = "0.8.15"
          package_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          init_text = Path("src/execweave/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_text)
          runtime_version = match.group(1) if match else None
          if package_version != expected or runtime_version != expected:
              raise SystemExit(f"version mismatch: package={package_version!r} runtime={runtime_version!r} expected={expected!r}")
          print(f"Exact RC version verified: {expected}")
          PY
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease)"
          python - "$release_json" "$TARGET_SHA" <<'PY'
          import json
          import sys
          obj = json.loads(sys.argv[1])
          target = sys.argv[2]
          if obj.get("tagName") != "v0.8.15":
              raise SystemExit(f"unexpected tag: {obj}")
          if obj.get("targetCommitish") != target:
              raise SystemExit(f"release target mismatch: {obj.get('targetCommitish')} != {target}")
          if obj.get("isDraft") or obj.get("isPrerelease"):
              raise SystemExit(f"release is not final: {obj}")
          print("Published GitHub Release target verified")
          PY

      - name: Dispatch existing Trusted Publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"ref":"main","inputs":{"release_tag":"v0.8.15"}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/dispatches" --input -
          echo "Dispatched .github/workflows/publish.yml for v0.8.15"
