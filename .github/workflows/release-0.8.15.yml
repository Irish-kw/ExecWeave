name: Verify ExecWeave 0.8.15 on public PyPI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release-0.8.15.yml

permissions:
  contents: read

jobs:
  verify-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact public PyPI version in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/execweave-pypi-0815
          /tmp/execweave-pypi-0815/bin/python -m pip install --upgrade pip
          /tmp/execweave-pypi-0815/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple "execweave==0.8.15"
          /tmp/execweave-pypi-0815/bin/python - <<'PY'
          import importlib.metadata
          import execweave

          expected = "0.8.15"
          dist_version = importlib.metadata.version("execweave")
          runtime_version = execweave.__version__
          print(f"DIST_VERSION={dist_version}")
          print(f"RUNTIME_VERSION={runtime_version}")
          if dist_version != expected or runtime_version != expected:
              raise SystemExit(
                  f"public PyPI version mismatch: dist={dist_version!r} runtime={runtime_version!r} expected={expected!r}"
              )
          print("PUBLIC_PYPI_EXACT_INSTALL=PASS")
          PY
