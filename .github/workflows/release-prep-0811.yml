name: One-shot v0.8.11 release prep

on:
  push:
    branches:
      - release/0.8.11

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.11
          fetch-depth: 0
      - name: Update release metadata and README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('pyproject.toml'),
              Path('src/execweave/__init__.py'),
              Path('tests/test_v069_dashboard_release.py'),
              *sorted(Path('.').glob('README*.md')),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              if '0.8.10' not in text:
                  raise SystemExit(f'expected 0.8.10 marker missing from {path}')
              text = text.replace('0.8.10', '0.8.11')
              path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = (
              'This README documents **v0.8.11**. This release fixes Windows Cursor launch '
              'resolution for arbitrary install roots and lets an ExecWeave-managed local '
              '`ollama serve` capture later loopback inference clients into the same semantic '
              'stream and dashboard.'
          )
          new = (
              'This README documents **v0.8.11**. This release makes managed local `ollama serve` '
              'capture fail-safe for independent loopback clients, so a later `ollama run`, SDK, '
              'or `curl` request from another terminal is recorded in the same semantic stream '
              'instead of silently falling back without conversation evidence. It also finalizes '
              'merged events, `graph.json`, and `viewer.html` when a Live run is stopped with Ctrl+C.'
          )
          if old not in text:
              raise SystemExit('expected English v0.8.10 release summary was not found after version bump')
          text = text.replace(old, new)

          old_ollama = (
              'For a managed local Ollama server, `execweave live --open -- ollama serve` owns the '
              'public loopback endpoint and relays the real server through an internal loopback port. '
              'A later `ollama run`, Ollama SDK request, OpenAI-compatible client, or `curl` started '
              'from another terminal can therefore appear in the same ExecWeave semantic stream even '
              'though that client is not a child of the `ollama serve` process. Relay mode is deliberately '
              'limited to local `localhost` / `127.0.0.1` binds; external, wildcard, and IPv6 exposure is '
              'not rewritten.'
          )
          new_ollama = (
              'For a managed local Ollama server, `execweave live --open -- ollama serve` owns the '
              'public loopback endpoint and relays the real server through an internal loopback port. '
              'A later `ollama run`, Ollama SDK request, OpenAI-compatible client, or `curl` started '
              'from another terminal can therefore appear in the same ExecWeave semantic stream even '
              'though that client is not a child of the `ollama serve` process. ExecWeave prints the '
              'active public-to-internal relay mapping; if the public loopback endpoint cannot be safely '
              'reserved, the managed run now fails explicitly rather than silently losing conversation '
              'capture. Relay mode is deliberately limited to local `localhost` / `127.0.0.1` binds; '
              'external, wildcard, and IPv6 exposure is not rewritten. Stopping Live with Ctrl+C still '
              'finalizes the run artifacts before returning.'
          )
          if old_ollama not in text:
              raise SystemExit('expected Ollama README paragraph not found')
          text = text.replace(old_ollama, new_ollama)
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/release-prep-0811.yml
      - name: Commit release prep
        shell: bash
        run: |
          git config user.name "GWW"
          git config user.email "49675917+Irish-kw@users.noreply.github.com"
          git add pyproject.toml src/execweave/__init__.py tests/test_v069_dashboard_release.py README*.md .github/workflows/release-prep-0811.yml
          git commit -m "Prepare v0.8.11 release"
          git push origin HEAD:release/0.8.11
