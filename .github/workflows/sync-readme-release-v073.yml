name: Sync v0.7.3 README Release Metadata

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard against stale CI trigger
        id: guard
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale trigger: CI=$TARGET_SHA main=$current"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Sync release metadata and regression guards
        if: steps.guard.outputs.go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', pyproject)
          if match is None:
              raise SystemExit("project version not found")
          version = match.group(1)
          if version != "0.7.3":
              raise SystemExit(f"refusing README sync for unexpected version {version}")
          old_tag = "v0.7.2"
          new_tag = f"v{version}"

          readmes = [
              Path("README.md"),
              Path("README.zh-TW.md"),
              Path("README.zh-CN.md"),
              Path("README.ja.md"),
              Path("README.ko.md"),
              Path("README.fr.md"),
              Path("README.de.md"),
              Path("README.ru.md"),
          ]
          total = 0
          for path in readmes:
              text = path.read_text(encoding="utf-8")
              count = text.count(old_tag)
              if count == 0:
                  raise SystemExit(f"{path}: expected at least one stale {old_tag} anchor")
              path.write_text(text.replace(old_tag, new_tag), encoding="utf-8")
              total += count
              print(f"{path}: replaced {count} release anchor(s)")
          if total != 24:
              raise SystemExit(f"expected exactly 24 README release replacements, got {total}")

          audit_path = Path("scripts/audit_i18n_parity.py")
          audit = audit_path.read_text(encoding="utf-8")
          old_required = '''README_REQUIRED_SNIPPETS = [
              "v0.6.9",
              "v0.7.2",
          '''
          new_required = '''def current_release_tag() -> str:
              pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
              match = re.search(r'(?m)^version\\s*=\\s*"([^\"]+)"\\s*$', pyproject)
              if match is None:
                  raise RuntimeError("project version not found in pyproject.toml")
              return f"v{match.group(1)}"


          README_REQUIRED_SNIPPETS = [
              "v0.6.9",
              current_release_tag(),
          '''
          if old_required not in audit:
              raise SystemExit("audit_i18n_parity.py: stale release snippet block not found")
          audit_path.write_text(audit.replace(old_required, new_required, 1), encoding="utf-8")

          test_path = Path("tests/test_v069_dashboard_release.py")
          test = test_path.read_text(encoding="utf-8")
          old_test = '        assert "v0.7.2" in text, path\n'
          new_test = '        assert f"v{__version__}" in text, path\n'
          if old_test not in test:
              raise SystemExit("README release assertion not found")
          test = test.replace(old_test, new_test, 1)
          old_english = '    assert "The current release is **v0.7.2**." in readme\n'
          new_english = '    assert f"The current release is **v{__version__}**." in readme\n'
          if old_english not in test:
              raise SystemExit("English current release assertion not found")
          test_path.write_text(test.replace(old_english, new_english, 1), encoding="utf-8")
          PY

          if grep -nH 'v0\.7\.2' README*.md; then
            echo "stale v0.7.2 remains in a root README" >&2
            exit 1
          fi
          python scripts/audit_i18n_parity.py
          python -m ruff check scripts/audit_i18n_parity.py tests/test_v069_dashboard_release.py
          python -m pytest -q tests/test_v069_dashboard_release.py
          git diff --check

      - name: Commit atomically after rechecking main
        if: steps.guard.outputs.go == 'true'
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "main advanced during validation; refusing to push" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-TW.md README.zh-CN.md README.ja.md README.ko.md README.fr.md README.de.md README.ru.md
          git add scripts/audit_i18n_parity.py tests/test_v069_dashboard_release.py
          git rm .github/workflows/sync-readme-release-v073.yml
          git commit -m "docs: sync README release metadata to v0.7.3"
          git push origin HEAD:main
