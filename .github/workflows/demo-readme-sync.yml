name: Demo README Sync

on:
  push:
    branches: [main]
    paths:
      - scripts/update_demo_readme.py
      - .github/workflows/demo-readme-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update demo asset and READMEs
        run: python scripts/update_demo_readme.py
      - name: Commit generated demo update
        run: |
          if git diff --quiet; then
            echo "No demo README changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README*.md docs/assets/execweave-live-demo.webp docs/assets/execweave-viewer.png
          git commit -m "docs: add reproducible live demo"
          git push
