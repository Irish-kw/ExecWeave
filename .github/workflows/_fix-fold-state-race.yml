name: Fix fold state rerender race

on:
  push:
    branches:
      - fix/antigravity-real-transcript-history
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-fold-state-rerender-race
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/antigravity-real-transcript-history
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev,e2e]'

      - name: Capture visible fold state synchronously before rerender
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/execweave/viewer_agent_panel.py')
          text = path.read_text(encoding='utf-8')
          old_state = '''function foldStateFor(node){\n  const key=agentKey(node);let state=foldStateByAgent.get(key);\n  if(!state){state=new Map();foldStateByAgent.set(key,state)}\n  return state;\n}\n'''
          new_state = '''function foldStateFor(node){\n  const key=agentKey(node);let state=foldStateByAgent.get(key);\n  if(!state){state=new Map();foldStateByAgent.set(key,state)}\n  return state;\n}\nfunction rememberVisibleFoldState(){\n  if(!selectedNode)return;\n  const state=foldStateFor(selectedNode);\n  for(const fold of details.querySelectorAll('.execweave-agent-older[data-fold-key]')){\n    const key=String(fold.dataset.foldKey||'');\n    if(key)state.set(key,fold.open);\n  }\n}\n'''
          assert text.count(old_state) == 1
          text = text.replace(old_state, new_state, 1)

          old_node = '''function renderNode(node){\n  const rows=nodeCards(node);\n  if(!rows.length)return false;\n  selectedNode=null;selectedConversationSignature='';detailsEmpty.hidden=true;details.replaceChildren();\n'''
          new_node = '''function renderNode(node){\n  const rows=nodeCards(node);\n  if(!rows.length)return false;\n  rememberVisibleFoldState();\n  selectedNode=null;selectedConversationSignature='';detailsEmpty.hidden=true;details.replaceChildren();\n'''
          assert text.count(old_node) == 1
          text = text.replace(old_node, new_node, 1)

          old_agent = '''function render(node){\n  if(!node)return false;\n  if(String(node.type||'')!=='agent')return renderNode(node);\n  selectedNode=node;selectedConversationSignature=conversationSignature(node);detailsEmpty.hidden=true;details.replaceChildren();\n'''
          new_agent = '''function render(node){\n  if(!node)return false;\n  if(String(node.type||'')!=='agent')return renderNode(node);\n  rememberVisibleFoldState();\n  selectedNode=node;selectedConversationSignature=conversationSignature(node);detailsEmpty.hidden=true;details.replaceChildren();\n'''
          assert text.count(old_agent) == 1
          path.write_text(text.replace(old_agent, new_agent, 1), encoding='utf-8')
          PY

      - name: Ruff
        run: python -m ruff check .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Stress historical Antigravity fold regression
        env:
          EXECWEAVE_E2E_REQUIRED: '1'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "fold regression attempt ${attempt}"
            python -m pytest -q tests/test_antigravity_history_replay.py::test_antigravity_history_survives_new_stop_and_manual_fold_state_in_chromium
          done

      - name: All viewer regressions
        env:
          EXECWEAVE_E2E_REQUIRED: '1'
        run: python -m pytest -m viewer_e2e -v

      - name: Commit production fix
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/execweave/viewer_agent_panel.py
          git commit -m 'fix: persist visible fold state before rerender'
          git push origin HEAD:fix/antigravity-real-transcript-history
