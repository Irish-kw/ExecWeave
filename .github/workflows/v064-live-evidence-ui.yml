name: Apply v0.6.4 live evidence UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v064-live-evidence-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/apply_v064_live_evidence_ui.py
      - name: Focused regression tests
        run: python -m pytest tests/test_v064_live_evidence.py tests/test_live.py tests/test_live_delta.py tests/test_live_theme.py -q
      - name: Ruff
        run: python -m ruff check src/execweave/live.py src/execweave/live_view.py tests/test_v064_live_evidence.py
      - name: Documentation parity
        run: |
          python scripts/sync_i18n_nav.py --check
          python scripts/audit_i18n_parity.py --languages fr de ru
      - name: Remove one-time files and commit
        run: |
          rm scripts/apply_v064_live_evidence_ui.py
          rm .github/workflows/v064-live-evidence-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/execweave/live.py src/execweave/live_view.py tests/test_v064_live_evidence.py README.md scripts/apply_v064_live_evidence_ui.py .github/workflows/v064-live-evidence-ui.yml
          git commit -m "feat: surface evidence layers in Live Viewer"
          git push origin HEAD:main
