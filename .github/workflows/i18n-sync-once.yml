name: One-time i18n sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/i18n-sync-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update v0.6.3 translations
        run: python scripts/sync_i18n_v063_once.py
      - name: Synchronize eight-language navigation
        run: python scripts/sync_i18n_nav.py
      - name: Audit translation parity
        run: python scripts/audit_i18n_parity.py
      - name: Validate diff
        run: git diff --check
      - name: Commit synchronized documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No documentation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README*.md docs/*.md
          git commit -m "docs: synchronize eight-language documentation"
          git push
