name: One-shot dashboard file activity repair

on:
  push:
    branches: [fix/dashboard-file-activity-clusters]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-file-activity-clusters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply guarded dashboard repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/execweave/viewer_dashboard_clean.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "  const provider=node=>String(node?.attributes?.provider||'unknown').toLowerCase();\n",
                  "  const fileDisplayMode=String(globalThis.__execweaveFileDisplayMode||'changed');\n"
                  "  const fileTypes=new Set(['file','directory']);\n"
                  "  const fileMutationEvents=new Set(['filesystem.created','filesystem.modified','filesystem.moved','filesystem.deleted']);\n"
                  "  const fileMutationRelation=relation=>/(^|_)(WROTE|WRITE|WRITES|CREATE|CREATED|UPDATE|UPDATED|EDIT|EDITED|DELETE|DELETED|MOVE|MOVED|RENAME|RENAMED|PATCH|REPLACE|REPLACED|SAVE|SAVED|MODIFY|MODIFIED)($|_)/.test(String(relation||'').toUpperCase());\n"
                  "  const fileActivity=node=>{\n"
                  "    if(!fileTypes.has(String(node?.type||'')))return'other';\n"
                  "    const eventTypes=Array.isArray(node?.event_types)?node.event_types:[];\n"
                  "    if(eventTypes.some(value=>fileMutationEvents.has(String(value))))return'changed';\n"
                  "    const related=[...(incoming.get(node.id)||[]),...(outgoing.get(node.id)||[])];\n"
                  "    return related.some(edge=>fileMutationRelation(edge?.relation))?'changed':'observed';\n"
                  "  };\n"
                  "  const fileVisible=node=>{const activity=fileActivity(node);if(activity==='other')return true;if(fileDisplayMode==='hide')return false;if(fileDisplayMode==='all')return true;return activity==='changed'};\n"
                  "  const provider=node=>String(node?.attributes?.provider||'unknown').toLowerCase();\n",
              ),
              (
                  "  let visibleNodes=allNodes.filter(node=>node&&node.id&&!hiddenIds.has(node.id)).filter(node=>node.type!=='tool'||toolCanonicalId.get(node.id)===node.id).map(node=>{\n"
                  "    if(node.type!=='tool')return node;\n",
                  "  const candidateNodes=allNodes.filter(node=>node&&node.id&&!hiddenIds.has(node.id)).filter(node=>node.type!=='tool'||toolCanonicalId.get(node.id)===node.id);\n"
                  "  const hiddenFileObservationCount=candidateNodes.filter(node=>fileTypes.has(String(node?.type||''))&&!fileVisible(node)).length;\n"
                  "  let visibleNodes=candidateNodes.filter(node=>fileVisible(node)).map(node=>{\n"
                  "    if(fileTypes.has(String(node?.type||'')))return{...node,attributes:{...attrsOf(node),viewer_file_activity:fileActivity(node)}};\n"
                  "    if(node.type!=='tool')return node;\n",
              ),
              (
                  "  const canonicalTypes=new Set(['process','file']);\n"
                  "  const foldableTypes=new Set(['process','file','network_endpoint']);\n",
                  "  const canonicalTypes=new Set(['process','file']);\n"
                  "  const foldableTypes=new Set(['process','file','directory','network_endpoint']);\n"
                  "  const foldType=node=>{const type=String(node?.type||'');return type==='file'||type==='directory'?'filesystem':type};\n",
              ),
              (
                  "  for(const node of nodes){const type=String(node?.type||'');if(!foldableTypes.has(type))continue;if(!byType.has(type))byType.set(type,[]);byType.get(type).push(node)}\n",
                  "  for(const node of nodes){const rawType=String(node?.type||'');if(!foldableTypes.has(rawType))continue;const type=foldType(node);if(!byType.has(type))byType.set(type,[]);byType.get(type).push(node)}\n",
              ),
              (
                  "    const keep=new Set(ordered.slice(0,FOLD_BUDGET).map(node=>node.id));\n"
                  "    const foldId=`viewer:folded:${type}`;\n"
                  "    for(const node of older)canonicalId.set(node.id,foldId);\n"
                  "    foldedNodeCount+=older.length;\n"
                  "    folds.push({id:foldId,type,name:`${older.length} earlier ${type.replace(/_/g,' ')}${older.length===1?'':'s'}`,first_seen:older.reduce((value,node)=>earlier(value,node.first_seen),null),last_seen:older.reduce((value,node)=>later(value,node.last_seen),null),attributes:{viewer_folded:true,viewer_folded_type:type,viewer_folded_count:older.length,viewer_folded_members:older.map(node=>({id:node.id,name:node.name||node.id,first_seen:node.first_seen||null,last_seen:node.last_seen||null}))}});\n"
                  "    for(let index=nodes.length-1;index>=0;index--)if(!keep.has(nodes[index].id)&&String(nodes[index].type||'')===type)nodes.splice(index,1);\n",
                  "    const removeIds=new Set(older.map(node=>node.id));\n"
                  "    const foldId=`viewer:folded:${type}`;\n"
                  "    for(const node of older)canonicalId.set(node.id,foldId);\n"
                  "    foldedNodeCount+=older.length;\n"
                  "    const foldedType=type==='filesystem'?'file_cluster':type,foldedName=type==='filesystem'?`${older.length} earlier files / directories`:`${older.length} earlier ${type.replace(/_/g,' ')}${older.length===1?'':'s'}`;\n"
                  "    const activities=[...new Set(older.map(node=>node?.attributes?.viewer_file_activity).filter(Boolean))];\n"
                  "    folds.push({id:foldId,type:foldedType,name:foldedName,first_seen:older.reduce((value,node)=>earlier(value,node.first_seen),null),last_seen:older.reduce((value,node)=>later(value,node.last_seen),null),attributes:{viewer_folded:true,viewer_folded_type:type,viewer_folded_count:older.length,viewer_file_activity:type==='filesystem'?(activities.length===1?activities[0]:'mixed'):undefined,viewer_folded_members:older.map(node=>({id:node.id,type:node.type,name:node.name||node.id,activity:node?.attributes?.viewer_file_activity||null,first_seen:node.first_seen||null,last_seen:node.last_seen||null}))}});\n"
                  "    for(let index=nodes.length-1;index>=0;index--)if(removeIds.has(nodes[index].id))nodes.splice(index,1);\n",
              ),
              (
                  "raw_tool_call_detail_count:allNodes.filter(node=>['tool_call','tool_call_observation'].includes(String(node?.type||''))).length}};\n",
                  "raw_tool_call_detail_count:allNodes.filter(node=>['tool_call','tool_call_observation'].includes(String(node?.type||''))).length,file_display_mode:fileDisplayMode,hidden_file_observation_node_count:hiddenFileObservationCount}};\n",
              ),
              (
                  "_LIVE_CORE_EXPORT_CLEAN = \"window.__execweaveCore={getActivities:()=>activities.slice(),getGraph:()=>graph,getDisplayGraph:()=>({...graph,nodes:[...nodeById.values()],edges:[...edgeById.values()],node_count:nodeById.size,edge_count:edgeById.size}),getPositions:()=>new Map(positions),selectEdge,selectNode,focusNode,markLatest,setCameraMode};\"\n",
                  "_LIVE_CORE_EXPORT_CLEAN = \"const execweaveFileGraphFilter=document.getElementById('file-graph-filter');globalThis.__execweaveFileDisplayMode=execweaveFileGraphFilter?.value||'changed';if(execweaveFileGraphFilter)execweaveFileGraphFilter.addEventListener('change',()=>{globalThis.__execweaveFileDisplayMode=execweaveFileGraphFilter.value||'changed';setSnapshot(graph)});window.__execweaveCore={getActivities:()=>activities.slice(),getGraph:()=>graph,getDisplayGraph:()=>({...graph,nodes:[...nodeById.values()],edges:[...edgeById.values()],node_count:nodeById.size,edge_count:edgeById.size}),getPositions:()=>new Map(positions),selectEdge,selectNode,focusNode,markLatest,setCameraMode};\"\n",
              ),
              (
                  "    marker = \"function renderSnapshot(){\"\n",
                  "    control_seam = '<div class=\"panel-spacer\"></div>\\n    <div class=\"segmented\" aria-label=\"Camera mode\">'\n"
                  "    control = '<div class=\"panel-spacer\"></div>\\n    <label class=\"graph-file-filter\" title=\"Choose which file and directory nodes appear in the graph\"><span>Files</span><select id=\"file-graph-filter\"><option value=\"changed\" selected>Changed only</option><option value=\"all\">All observed</option><option value=\"hide\">Hidden</option></select></label>\\n    <div class=\"segmented\" aria-label=\"Camera mode\">'\n"
                  "    if html.count(control_seam) != 1:\n"
                  "        raise RuntimeError(\"file graph filter control seam changed\")\n"
                  "    html = html.replace(control_seam, control, 1)\n"
                  "    marker = \"function renderSnapshot(){\"\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"viewer_dashboard_clean guard failed: expected one match, got {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          style_path = Path("src/execweave/live_view_style.py")
          style = style_path.read_text(encoding="utf-8")
          style_replacements = [
              (
                  "button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--selected);outline-offset:2px}",
                  "button,input,select{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--selected);outline-offset:2px}",
              ),
              (
                  ".panel-bar{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel);min-width:0}.panel-title{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.panel-subtitle{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel-spacer{flex:1}\n",
                  ".panel-bar{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel);min-width:0}.panel-title{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.panel-subtitle{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel-spacer{flex:1}\n.graph-file-filter{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;white-space:nowrap}.graph-file-filter select{height:30px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--text);cursor:pointer}.graph-file-filter select:hover{border-color:var(--border-strong)}\n",
              ),
          ]
          for old, new in style_replacements:
              count = style.count(old)
              if count != 1:
                  raise SystemExit(f"live_view_style guard failed: expected one match, got {count}: {old[:120]!r}")
              style = style.replace(old, new, 1)
          style_path.write_text(style, encoding="utf-8")

          test_path = Path("tests/test_dashboard_file_activity_filter.py")
          test_path.write_text('''from __future__ import annotations\n\nfrom execweave.dashboard_shell import DASHBOARD_HTML\nfrom execweave.viewer_dashboard_clean import _DASHBOARD_JS\n\n\ndef test_dashboard_exposes_file_activity_filter_with_changed_default() -> None:\n    assert 'id="file-graph-filter"' in DASHBOARD_HTML\n    assert '<option value="changed" selected>Changed only</option>' in DASHBOARD_HTML\n    assert '<option value="all">All observed</option>' in DASHBOARD_HTML\n    assert '<option value="hide">Hidden</option>' in DASHBOARD_HTML\n    assert "__execweaveFileDisplayMode" in DASHBOARD_HTML\n\n\ndef test_dashboard_file_projection_distinguishes_changes_from_scans() -> None:\n    assert "fileMutationEvents=new Set(['filesystem.created','filesystem.modified','filesystem.moved','filesystem.deleted'])" in _DASHBOARD_JS\n    assert "fileDisplayMode==='hide'" in _DASHBOARD_JS\n    assert "fileDisplayMode==='all'" in _DASHBOARD_JS\n    assert "return activity==='changed'" in _DASHBOARD_JS\n    assert "hidden_file_observation_node_count" in _DASHBOARD_JS\n\n\ndef test_file_and_directory_nodes_share_one_fold_group() -> None:\n    assert "type==='file'||type==='directory'?'filesystem':type" in _DASHBOARD_JS\n    assert "viewer:folded:${type}" in _DASHBOARD_JS\n    assert "earlier files / directories" in _DASHBOARD_JS\n    assert "foldedType=type==='filesystem'?'file_cluster':type" in _DASHBOARD_JS\n''', encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Targeted dashboard tests
        run: |
          pytest -q tests/test_dashboard_file_activity_filter.py tests/test_dashboard_simplification.py tests/test_dashboard_information_architecture.py tests/test_live_dashboard_js.py tests/test_live_dashboard.py tests/test_provider_neutral_viewer_semantics.py
          ruff check src/execweave/viewer_dashboard_clean.py src/execweave/live_view_style.py tests/test_dashboard_file_activity_filter.py
      - name: Execute projection semantics in Node
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from execweave.viewer_dashboard_clean import _DASHBOARD_JS

          graph = {
              "nodes": [
                  {"id":"agent:root","type":"agent","name":"root","attributes":{}},
                  {"id":"file:read","type":"file","name":"read.txt","event_types":["filesystem.opened","filesystem.closed"],"attributes":{}},
                  {"id":"file:write","type":"file","name":"write.txt","event_types":["filesystem.modified"],"attributes":{}},
                  {"id":"directory:scan","type":"directory","name":"scan","event_types":["filesystem.opened"],"attributes":{}},
              ],
              "edges": [
                  {"id":"r","source":"agent:root","target":"file:read","relation":"READ_FILE"},
                  {"id":"w","source":"agent:root","target":"file:write","relation":"WROTE_FILE"},
              ],
          }
          script = Path("/tmp/execweave-file-filter.js")
          script.write_text(_DASHBOARD_JS + "\nconst data=JSON.parse(process.argv[2]);for(const mode of ['changed','all','hide']){globalThis.__execweaveFileDisplayMode=mode;const out=execweaveDashboardGraph(data);console.log(mode+':'+JSON.stringify(out.nodes.map(n=>n.id).sort()))}\n", encoding="utf-8")
          completed = subprocess.run(["node", str(script), json.dumps(graph)], check=True, text=True, capture_output=True)
          lines = completed.stdout.strip().splitlines()
          assert lines[0] == 'changed:["agent:root","file:write"]', lines
          assert lines[1] == 'all:["agent:root","directory:scan","file:read","file:write"]', lines
          assert lines[2] == 'hide:["agent:root"]', lines
          PY
      - name: Commit repaired source and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-dashboard-file-filter.yml
          git add src/execweave/viewer_dashboard_clean.py src/execweave/live_view_style.py tests/test_dashboard_file_activity_filter.py
          git commit -m "feat: filter and aggregate dashboard file activity"
          git push origin HEAD:fix/dashboard-file-activity-clusters
