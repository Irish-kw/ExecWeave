name: Validate root layout tool-call aggregation

on:
  push:
    branches:
      - fix/root-layout-toolcall-aggregation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXECWEAVE_E2E_REQUIRED: "1"
      EXECWEAVE_REAL_DASHBOARD_SCREENSHOT: ${{ github.workspace }}/artifacts/root-layout-toolcall/dashboard.png
      EXPECTED_MAIN_SHA: abf1e6b50f0581ce6f8d055f9a12fd8448d02d80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply candidate patch
        run: python scripts/_apply_root_layout_toolcall_patch.py
      - name: Preserve contracts and wire final tool inspector
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          clean = Path("src/execweave/viewer_dashboard_clean.py")
          text = clean.read_text(encoding="utf-8")
          old = "['observed_content','tool_call','tool_call_observation','agent_turn'"
          new = "['observed_content','tool_call','agent_turn','tool_call_observation'"
          if text.count(old) != 1:
              raise SystemExit(f"hidden type compatibility seam: {text.count(old)} matches")
          clean.write_text(text.replace(old, new, 1), encoding="utf-8")

          focus = Path("src/execweave/viewer_dashboard_focus.py")
          text = focus.read_text(encoding="utf-8")
          old = "if(['process','tool'].includes(String(node.type||''))&&occurrenceCount>1&&!/\\s×\\d+$/.test(String(name||'')))name=`${name||node.id} ×${occurrenceCount}`;"
          new = "if(node.type==='process'&&occurrenceCount>1&&!/\\s×\\d+$/.test(String(name||'')))name=`${name||node.id} ×${occurrenceCount}`;\n      if(node.type==='tool'&&occurrenceCount>1&&!/\\s×\\d+$/.test(String(name||'')))name=`${name||node.id} ×${occurrenceCount}`;"
          if text.count(old) != 1:
              raise SystemExit(f"occurrence label compatibility seam: {text.count(old)} matches")
          focus.write_text(text.replace(old, new, 1), encoding="utf-8")

          panel = Path("src/execweave/viewer_agent_panel.py")
          text = panel.read_text(encoding="utf-8")
          old = "    add('Calls',traffic.count?String(traffic.count):'');"
          new = "    const occurrences=Array.isArray(a.viewer_tool_call_occurrences)?a.viewer_tool_call_occurrences:[];\n    add('Calls',occurrences.length?String(occurrences.length):(traffic.count?String(traffic.count):''));"
          if text.count(old) != 1:
              raise SystemExit(f"tool call count seam: {text.count(old)} matches")
          text = text.replace(old, new, 1)

          pattern = re.compile(r"function renderNode\(node\)\{.*?\n\}\nfunction render\(node\)\{", re.DOTALL)
          replacement = r"""function toolOccurrenceSection(node){
            const occurrences=Array.isArray(attrs(node).viewer_tool_call_occurrences)?attrs(node).viewer_tool_call_occurrences:[];
            if(!occurrences.length)return null;
            const section=document.createElement('section');section.className='execweave-tool-occurrences';
            const title=document.createElement('strong');title.textContent=`Invocations · ${occurrences.length} call${occurrences.length===1?'':'s'}`;section.appendChild(title);
            occurrences.forEach((occurrence,index)=>{
              const fold=document.createElement('details');fold.className='execweave-tool-occurrence';
              const summary=document.createElement('summary');
              const owner=nodeNamed(occurrence?.owner_id)?.name||occurrence?.owner_id||'unknown';
              const when=moment(occurrence?.first_seen||occurrence?.last_seen);
              summary.textContent=[when,owner,`call ${index+1}`].filter(Boolean).join(' · ');
              const pre=document.createElement('pre');
              pre.textContent=JSON.stringify({
                first_seen:occurrence?.first_seen||null,
                last_seen:occurrence?.last_seen||null,
                first_sequence:occurrence?.first_sequence??null,
                last_sequence:occurrence?.last_sequence??null,
                input:occurrence?.input??null,
                output:occurrence?.output??null,
                call_ids:occurrence?.call_ids||[],
                content_references:occurrence?.content_references||[]
              },null,2);
              fold.append(summary,pre);section.appendChild(fold);
            });
            return section;
          }
          function renderNode(node){
            const rows=nodeCards(node);
            if(!rows.length)return false;
            rememberVisibleFoldState();
            selectedNode=null;selectedConversationSignature='';detailsEmpty.hidden=true;details.replaceChildren();
            const view=document.createElement('div');view.className='execweave-agent-view';
            for(const[label,text]of rows)view.appendChild(card(label,text));
            details.appendChild(view);
            const occurrences=toolOccurrenceSection(node);if(occurrences)details.appendChild(occurrences);
            return true;
          }
          function render(node){"""
          text, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"tool inspector render seam: {count} matches")
          panel.write_text(text, encoding="utf-8")
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Format permanent regression
        run: ruff format tests/test_dashboard_root_layout_toolcall_aggregation.py
      - name: Ruff
        run: |
          ruff check \
            src/execweave/antigravity_adapter_base.py \
            src/execweave/antigravity_full_fidelity_base.py \
            src/execweave/viewer_dashboard_clean.py \
            src/execweave/viewer_dashboard_focus.py \
            src/execweave/viewer_agent_panel.py \
            src/execweave/live_view_markup.py \
            src/execweave/live_view_readability.py \
            tests/test_dashboard_root_layout_toolcall_aggregation.py
      - name: Focused non-browser regressions
        run: |
          pytest -q \
            tests/test_dashboard_root_layout_toolcall_aggregation.py \
            tests/test_antigravity_root_child_history_v2.py \
            tests/test_dashboard_simplification.py \
            -m "not viewer_e2e"
      - name: Required Chromium root layout tool-call gate
        run: pytest -q tests/test_dashboard_root_layout_toolcall_aggregation.py -m viewer_e2e
      - name: Full Viewer E2E
        run: pytest -q -m viewer_e2e
      - name: Full non-browser suite
        run: pytest -q -m "not viewer_e2e"
      - name: Upload inspected Dashboard screenshot
        uses: actions/upload-artifact@v4
        with:
          name: root-layout-toolcall-dashboard
          path: artifacts/root-layout-toolcall/dashboard.png
          if-no-files-found: error
      - name: Commit only validated product and regression changes
        env:
          BRANCH: fix/root-layout-toolcall-aggregation
        run: |
          git fetch origin main "$BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/$BRANCH)" = "$GITHUB_SHA"
          git rm scripts/_apply_root_layout_toolcall_patch.py .github/workflows/_validate-root-layout-toolcall.yml
          git add \
            src/execweave/antigravity_adapter_base.py \
            src/execweave/antigravity_full_fidelity_base.py \
            src/execweave/viewer_dashboard_clean.py \
            src/execweave/viewer_dashboard_focus.py \
            src/execweave/viewer_agent_panel.py \
            src/execweave/live_view_markup.py \
            src/execweave/live_view_readability.py \
            tests/test_dashboard_root_layout_toolcall_aggregation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: root identity layout and tool call aggregation"
          git push origin HEAD:"$BRANCH"
