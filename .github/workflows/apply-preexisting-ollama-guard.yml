name: Apply preexisting Ollama guard fix

on:
  push:
    branches:
      - fix/ollama-serve-windows-finalization

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ollama-serve-windows-finalization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guard
        run: python scripts/apply_preexisting_ollama_guard.py
      - name: Validate
        run: |
          python -m compileall -q src
          git diff --check
      - name: Commit source fix
        run: |
          rm scripts/apply_preexisting_ollama_guard.py
          rm .github/workflows/apply-preexisting-ollama-guard.yml
          git config user.name "GWW"
          git config user.email "49675917+Irish-kw@users.noreply.github.com"
          git add -A
          git commit -m "Preserve preexisting Ollama server attribution"
          git push origin HEAD:fix/ollama-serve-windows-finalization
