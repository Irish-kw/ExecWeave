name: Bootstrap scoped orchestration flow ranks

on:
  push:
    branches: [feature/model-orchestration-flow]
    paths: [.github/workflows/bootstrap-scope-orchestration-flow.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-orchestration-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scope execution-flow activation and agent ranks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/execweave/viewer_orchestration_projection.py')
          text = path.read_text(encoding='utf-8')

          activation_start = text.index('    model_observations = _model_observations(\n')
          activation_end = text.index('\n    spawn_edges = [', activation_start)
          activation = "\n".join([
              '    if not orchestration_calls:',
              '        return projected',
              '    model_observations = _model_observations(',
              '        nodes, edges, orchestration_calls=orchestration_calls',
              '    )',
          ])
          text = text[:activation_start] + activation + text[activation_end:]

          rank_marker = '    for node in nodes:\n        node_id = node.get("id")\n        if node_id in depths and node.get("type") == "agent":\n'
          rank_start = text.index(rank_marker)
          rank_end = text.index('\n    model_context_ids:', rank_start)
          rank = "\n".join([
              '    flow_agent_ids = {str(row["owner"]) for row in orchestration_calls}',
              '    for row in orchestration_calls:',
              '        flow_agent_ids.update(',
              '            str(target) for target in row["targets"] if target in agent_ids',
              '        )',
              '    for pairs in spawn_assignments.values():',
              '        flow_agent_ids.update(',
              '            str(target) for target, _edge in pairs if target in agent_ids',
              '        )',
              '',
              '    for node in nodes:',
              '        node_id = node.get("id")',
              '        if node_id in flow_agent_ids and node.get("type") == "agent":',
              '            node["attributes"] = {',
              '                **_attrs(node),',
              '                "viewer_flow_rank": depths[str(node_id)] * 3,',
              '                "viewer_execution_flow_identity": True,',
              '            }',
          ])
          path.write_text(text[:rank_start] + rank + text[rank_end:], encoding='utf-8', newline='\n')
          PY
      - name: Install focused dependencies
        run: python -m pip install -e ".[dev,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate scoped behavior
        env:
          EXECWEAVE_E2E_REQUIRED: "1"
        run: |
          python -m ruff check src/execweave/viewer_orchestration_projection.py tests/test_orchestration_flow_activation.py tests/test_orchestration_flow_projection.py tests/test_orchestration_send_input_fallback.py tests/test_orchestration_flow_layout_e2e.py
          python -m pytest -q tests/test_orchestration_flow_activation.py tests/test_orchestration_flow_projection.py tests/test_orchestration_send_input_fallback.py
          xvfb-run -a python -m pytest -q tests/test_orchestration_flow_layout_e2e.py tests/test_graph_node_sizing_e2e.py::test_lanes_keep_their_established_positions_when_nothing_is_wide
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/execweave/viewer_orchestration_projection.py
          git commit -m "Scope model orchestration flow to participating agents"
          git push origin HEAD:feature/model-orchestration-flow
