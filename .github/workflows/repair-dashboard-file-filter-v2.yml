name: One-shot dashboard file filter v2

on:
  push:
    branches: [fix/dashboard-file-activity-clusters]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-file-activity-clusters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply evidence-aware classification fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/execweave/viewer_dashboard_clean.py")
          text = path.read_text(encoding="utf-8")
          old = """  const fileActivity=node=>{\n    if(!fileTypes.has(String(node?.type||'')))return'other';\n    const eventTypes=Array.isArray(node?.event_types)?node.event_types:[];\n    if(eventTypes.some(value=>fileMutationEvents.has(String(value))))return'changed';\n    const related=[...(incoming.get(node.id)||[]),...(outgoing.get(node.id)||[])];\n    return related.some(edge=>fileMutationRelation(edge?.relation))?'changed':'observed';\n  };\n  const fileVisible=node=>{const activity=fileActivity(node);if(activity==='other')return true;if(fileDisplayMode==='hide')return false;if(fileDisplayMode==='all')return true;return activity==='changed'};\n"""
          new = """  const fileReadRelation=relation=>/(^|_)(READ|OPEN|SCAN|LIST|STAT|INSPECT|OBSERVE|OBSERVED)($|_)/.test(String(relation||'').toUpperCase());\n  const fileActivity=node=>{\n    if(!fileTypes.has(String(node?.type||'')))return'other';\n    const eventTypes=Array.isArray(node?.event_types)?node.event_types:[];\n    if(eventTypes.some(value=>fileMutationEvents.has(String(value))))return'changed';\n    const related=[...(incoming.get(node.id)||[]),...(outgoing.get(node.id)||[])];\n    if(related.some(edge=>fileMutationRelation(edge?.relation)))return'changed';\n    const observedEvents=eventTypes.some(value=>String(value).startsWith('filesystem.'));\n    if(observedEvents||related.some(edge=>fileReadRelation(edge?.relation)))return'observed';\n    return'unknown';\n  };\n  const fileVisible=node=>{const activity=fileActivity(node);if(activity==='other')return true;if(fileDisplayMode==='hide')return false;if(fileDisplayMode==='all')return true;return activity!=='observed'};\n"""
          if text.count(old) != 1:
              raise SystemExit(f"classification seam count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_dashboard_file_activity_filter.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = "    assert \"return activity==='changed'\" in _DASHBOARD_JS\n"
          new_test = "    assert \"return activity!=='observed'\" in _DASHBOARD_JS\n    assert \"return'unknown'\" in _DASHBOARD_JS\n"
          if tests.count(old_test) != 1:
              raise SystemExit(f"test seam count={tests.count(old_test)}")
          test_path.write_text(tests.replace(old_test, new_test, 1), encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,e2e]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Regression and targeted browser tests
        run: |
          pytest -q tests/test_dashboard_file_activity_filter.py tests/test_dashboard_simplification.py tests/test_live_dashboard_js.py tests/test_live_dashboard.py
          pytest -q \
            tests/test_dashboard_camera_scheduler_e2e.py::test_delta_vertical_retention_never_reintroduces_node_overlap \
            tests/test_viewer_agent_isolation_e2e.py::test_a_crowded_type_folds_its_older_nodes_instead_of_dropping_them \
            tests/test_viewer_agent_isolation_e2e.py::test_the_reader_chooses_how_many_of_a_crowded_type_stay_drawn
          ruff check src/execweave/viewer_dashboard_clean.py tests/test_dashboard_file_activity_filter.py
      - name: Execute file filter semantics in Node
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from execweave.viewer_dashboard_clean import _DASHBOARD_JS

          graph = {
              "nodes": [
                  {"id":"agent:root","type":"agent","name":"root","attributes":{}},
                  {"id":"file:read","type":"file","name":"read.txt","event_types":["filesystem.opened","filesystem.closed"],"attributes":{}},
                  {"id":"file:write","type":"file","name":"write.txt","event_types":["filesystem.modified"],"attributes":{}},
                  {"id":"directory:scan","type":"directory","name":"scan","event_types":["filesystem.opened"],"attributes":{}},
                  {"id":"file:legacy","type":"file","name":"legacy.txt","attributes":{}},
              ],
              "edges": [
                  {"id":"r","source":"agent:root","target":"file:read","relation":"READ_FILE"},
                  {"id":"w","source":"agent:root","target":"file:write","relation":"WROTE_FILE"},
              ],
          }
          script = Path("/tmp/execweave-file-filter-v2.js")
          script.write_text(_DASHBOARD_JS + "\nconst data=JSON.parse(process.argv[2]);for(const mode of ['changed','all','hide']){globalThis.__execweaveFileDisplayMode=mode;const out=execweaveDashboardGraph(data);console.log(mode+':'+JSON.stringify(out.nodes.map(n=>n.id).sort()))}\n", encoding="utf-8")
          completed = subprocess.run(["node", str(script), json.dumps(graph)], check=True, text=True, capture_output=True)
          lines = completed.stdout.strip().splitlines()
          assert lines[0] == 'changed:["agent:root","file:legacy","file:write"]', lines
          assert lines[1] == 'all:["agent:root","directory:scan","file:legacy","file:read","file:write"]', lines
          assert lines[2] == 'hide:["agent:root"]', lines
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-dashboard-file-filter-v2.yml
          git add src/execweave/viewer_dashboard_clean.py tests/test_dashboard_file_activity_filter.py
          git commit -m "fix: hide only proven read-only file activity"
          git push origin HEAD:fix/dashboard-file-activity-clusters
