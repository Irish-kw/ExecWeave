name: i18n parity audit

on:
  push:
    branches:
      - fix/linux-inotify-watch-exhaustion

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit translated documentation parity
        run: python scripts/audit_i18n_parity.py
