name: Wheel Install Smoke

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/execweave/**"
      - "scripts/canonicalize_wheel.py"
      - "scripts/check_distribution_contents.py"
      - "scripts/check_wheel_install.py"
      - "scripts/check_installed_dashboard.py"
      - "scripts/installed_dashboard_probe.py"
      - "scripts/installed_dashboard_live_probe.py"
      - ".github/workflows/wheel-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build canonical wheel and hermetic sdist
        run: |
          python -m pip install --upgrade build hatchling
          python -m build
          python scripts/canonicalize_wheel.py dist
          python scripts/check_distribution_contents.py
      - name: Preserve resolved acceptance dependencies
        shell: bash
        run: |
          wheel="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve())")"
          python -m pip download --dest acceptance-wheelhouse "$wheel[dev,e2e,release]" hatchling
          python -m pip freeze > acceptance-wheelhouse/build-environment.txt
          git rev-parse HEAD > acceptance-wheelhouse/source-sha.txt
      - name: Upload reproducible package and dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installed-package-inputs-${{ matrix.os }}
          path: |
            dist
            acceptance-wheelhouse
          if-no-files-found: error
          retention-days: 7
      - name: Clean wheel install smoke
        run: python scripts/check_wheel_install.py

      - name: Install resolved wheel browser driver
        shell: bash
        run: |
          wheel="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve())")"
          python -m pip install --no-index --find-links acceptance-wheelhouse "$wheel[e2e]"
      - name: Provision Chromium and OS libraries
        run: python -m playwright install --with-deps chromium
      - name: Clean isolated wheel Dashboard and GIF acceptance
        run: python scripts/check_installed_dashboard.py --wheelhouse acceptance-wheelhouse
      - name: Upload installed-product browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-dashboard-${{ matrix.os }}
          path: artifacts/installed-dashboard
          if-no-files-found: error
          retention-days: 7

  cross-os-wheel-identity:
    needs: wheel-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installed-package-inputs-*
          path: package-inputs
      - name: Require one byte-identical canonical wheel from every OS
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          wheels = sorted(
              path for path in Path('package-inputs').rglob('execweave-*.whl')
              if path.parent.name == 'dist'
          )
          if len(wheels) != 3:
              raise SystemExit(f'expected exactly three wheel-smoke wheels, got {wheels}')
          hashes = {str(path): sha256(path.read_bytes()).hexdigest() for path in wheels}
          if len(set(hashes.values())) != 1:
              raise SystemExit(f'cross-OS wheel bytes differ: {hashes}')
          print(hashes)
          PY
