name: Sync LM Studio automatic live docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-lmstudio-auto-probe-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize README and model-runtime docs
        run: python scripts/sync_lmstudio_auto_probe_docs.py
      - name: Documentation parity
        run: |
          python scripts/sync_i18n_nav.py --check
          python scripts/audit_i18n_parity.py --languages fr de ru
      - name: Remove one-time synchronizer and commit
        run: |
          rm scripts/sync_lmstudio_auto_probe_docs.py
          rm .github/workflows/sync-lmstudio-auto-probe-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: mark LM Studio automatic live probe"
          git push origin HEAD:main
