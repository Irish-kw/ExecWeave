name: Cleanup old workflow runs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-old-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the 587 older workflow runs and preserve the two newest pre-existing runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/runs?per_page=100"
          tmp="$(mktemp)"

          page=1
          while :; do
            body="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}&page=${page}")"

            count="$(jq '.workflow_runs | length' <<<"${body}")"
            if [[ "${count}" -eq 0 ]]; then
              break
            fi

            jq -r --arg current "${CURRENT_RUN_ID}" \
              '.workflow_runs[] | select((.id|tostring) != $current) | [.created_at, (.id|tostring)] | @tsv' \
              <<<"${body}" >> "${tmp}"

            page=$((page + 1))
          done

          total="$(wc -l < "${tmp}" | tr -d ' ')"
          echo "Found ${total} pre-existing workflow runs."

          if [[ "${total}" -lt 589 ]]; then
            echo "Expected at least 589 pre-existing runs; refusing to delete anything." >&2
            exit 1
          fi

          sort -r "${tmp}" > "${tmp}.sorted"

          echo "Preserving the two newest pre-existing runs:"
          head -n 2 "${tmp}.sorted"

          tail -n +3 "${tmp}.sorted" | head -n 587 | cut -f2 > "${tmp}.delete"

          delete_count="$(wc -l < "${tmp}.delete" | tr -d ' ')"
          if [[ "${delete_count}" -ne 587 ]]; then
            echo "Refusing: selected ${delete_count} runs instead of exactly 587." >&2
            exit 1
          fi

          while read -r run_id; do
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}"
          done < "${tmp}.delete"

          echo "Deleted exactly ${delete_count} workflow runs."
