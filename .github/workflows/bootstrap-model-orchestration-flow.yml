name: Bootstrap model orchestration flow patch

on:
  push:
    branches: [feature/model-orchestration-flow]
    paths: [.github/workflows/bootstrap-model-orchestration-flow.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-orchestration-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch execution-flow wiring and layout ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one seam, found {text.count(old)} for {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'src/execweave/dashboard_shell.py',
              'from .viewer_semantic_projection import project_provider_neutral_viewer_graph',
              'from .viewer_orchestration_projection import project_model_orchestration_viewer_graph',
          )
          replace_once(
              'src/execweave/dashboard_shell.py',
              '_viewer_projection_base.project_viewer_graph = project_provider_neutral_viewer_graph',
              '_viewer_projection_base.project_viewer_graph = project_model_orchestration_viewer_graph',
          )
          replace_once(
              'src/execweave/dashboard_shell.py',
              "  }else if(kind==='model'){\n    add('Model',node?.name);\n    add('Provider',a.provider||a.provider_name);\n    add('Inference calls',a.viewer_inference_count);\n    add('Inference history',execweaveInferenceHistory(a));\n  }else if(kind==='tool_call'){",
              "  }else if(kind==='model'||kind==='model_context'){\n    add('Model',node?.name);\n    add('Provider',a.provider||a.provider_name);\n    if(kind==='model_context'){add('Owner agent',a.owner_agent_id);add('Semantic model IDs',Array.isArray(a.semantic_model_ids)?a.semantic_model_ids.join(', '):a.semantic_model_ids)}\n    add('Inference calls',a.viewer_inference_count);\n    add('Inference history',execweaveInferenceHistory(a));\n  }else if(kind==='tool_action'){\n    add('Action',a.action_kind||node?.name);\n    add('Model context',a.model_name);\n    add('Owner agent',a.owner_agent_id);\n    add('Calls',a.call_count);\n  }else if(kind==='tool_call'){",
          )

          replace_once(
              'src/execweave/live_view_readability.py',
              "  const put=(node,lane,order,y)=>spec.set(node.id,{lane,rank:EXECWEAVE_LANES[lane],order,x:laneX[lane],y});",
              "  const put=(node,lane,order,y)=>{const declared=Number(execweaveAttrs(node).viewer_flow_rank),rank=Number.isFinite(declared)?declared:EXECWEAVE_LANES[lane];spec.set(node.id,{lane,rank,order,x:laneX[lane],y})};",
          )
          replace_once(
              'src/execweave/live_view_readability.py',
              "  byLane.get('tool').sort((a,b)=>{\n    const ac=/spawn|send|wait|agent/i.test(String(a?.name||execweaveAttrs(a).tool_name||'')),bc=/spawn|send|wait|agent/i.test(String(b?.name||execweaveAttrs(b).tool_name||''));",
              "  byLane.get('tool').sort((a,b)=>{\n    const af=Number(execweaveAttrs(a).viewer_flow_first_sequence),bf=Number(execweaveAttrs(b).viewer_flow_first_sequence);\n    if(Number.isFinite(af)&&Number.isFinite(bf)&&af!==bf)return af-bf;\n    const ac=/spawn|send|wait|agent/i.test(String(a?.name||execweaveAttrs(a).tool_name||'')),bc=/spawn|send|wait|agent/i.test(String(b?.name||execweaveAttrs(b).tool_name||''));",
          )

          replace_once(
              'src/execweave/live_view_process_layout.py',
              "    const ids=[...topo.spec.keys()].filter(id=>topo.spec.get(id)?.lane===lane&&!isProcess(nodeById.get(id)));",
              "    const ids=[...topo.spec.keys()].filter(id=>{const node=nodeById.get(id),flowRank=Number(typeof execweaveAttrs==='function'?execweaveAttrs(node).viewer_flow_rank:NaN);return topo.spec.get(id)?.lane===lane&&!isProcess(node)&&!Number.isFinite(flowRank)});",
          )
          PY
      - name: Install focused test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate focused projection and static contracts
        run: |
          python -m ruff check src/execweave/viewer_orchestration_projection.py tests/test_orchestration_flow_projection.py src/execweave/dashboard_shell.py src/execweave/live_view_readability.py src/execweave/live_view_process_layout.py
          python -m pytest -q tests/test_orchestration_flow_projection.py tests/test_dashboard_information_architecture.py tests/test_process_tree_layout.py
      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/execweave/dashboard_shell.py src/execweave/live_view_readability.py src/execweave/live_view_process_layout.py
          git commit -m "Wire model-scoped orchestration flow into dashboard layout"
          git push origin HEAD:feature/model-orchestration-flow
