name: Validate model orchestration flow

on:
  push:
    branches: [feature/model-orchestration-flow]
    paths: [.github/workflows/bootstrap-model-orchestration-flow.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-orchestration-flow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate source and projection
        run: |
          python -m ruff check src/execweave/viewer_orchestration_projection.py tests/test_orchestration_flow_projection.py tests/test_orchestration_flow_layout_e2e.py src/execweave/dashboard_shell.py src/execweave/viewer_dashboard_clean.py src/execweave/live_view_readability.py src/execweave/live_view_process_layout.py
          python -m pytest -q tests/test_orchestration_flow_projection.py tests/test_dashboard_information_architecture.py tests/test_process_tree_layout.py tests/test_dashboard_simplification.py
      - name: Validate real browser geometry
        env:
          EXECWEAVE_E2E_REQUIRED: "1"
        run: xvfb-run -a python -m pytest -q tests/test_orchestration_flow_layout_e2e.py
