name: Bootstrap model orchestration flow patch

on:
  push:
    branches: [feature/model-orchestration-flow]
    paths: [.github/workflows/bootstrap-model-orchestration-flow.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-orchestration-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch execution-flow wiring and layout ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one seam, found {text.count(old)} for {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          projection = Path('src/execweave/viewer_orchestration_projection.py')
          text = projection.read_text(encoding='utf-8')
          start = text.index('    kept_nodes = [\n')
          end = text.index('\n    result = deepcopy(projected)', start)
          replacement = '''    kept_nodes: list[dict[str, Any]] = []
    for node in nodes:
        node_id = node.get("id")
        replacement_kind = None
        if node_id in represented_model_ids:
            replacement_kind = "model_context"
        elif node_id in orchestration_tool_ids:
            replacement_kind = "orchestration_action"
        if replacement_kind:
            node["attributes"] = {
                **_attrs(node),
                "viewer_flow_superseded": True,
                "viewer_flow_replaced_by": replacement_kind,
            }
        kept_nodes.append(node)

    kept_edges: list[dict[str, Any]] = []
    for edge in edges:
        edge_id = str(edge.get("id") or "")
        source, target = edge.get("source"), edge.get("target")
        superseded_reason = None
        if edge_id in represented_spawn_edge_ids:
            superseded_reason = "orchestration_spawn_reanchor"
        elif source in represented_model_ids or target in represented_model_ids:
            superseded_reason = "model_context"
        elif source in orchestration_tool_ids or target in orchestration_tool_ids:
            superseded_reason = "orchestration_action"
        if superseded_reason:
            kept_edges.append(
                {
                    **edge,
                    "viewer_flow_superseded": True,
                    "viewer_flow_superseded_reason": superseded_reason,
                }
            )
        else:
            kept_edges.append(edge)
'''
          projection.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='\n')

          replace_once(
              'tests/test_orchestration_flow_projection.py',
              '    assert not any(edge["source"] == ROOT and edge["relation"] == "SPAWNED_AGENT" and edge["target"] in {A1, A2, A3} for edge in edges)\n    assert not {"model:55", "model:luna", "tool:spawn", "tool:send", "tool:wait"} & set(by_id)\n    flow_edges = [edge for edge in edges if edge.get("relation") in {"MODEL_CONTEXT", "ORCHESTRATED_ACTION", "SPAWNED_AGENT", "SENT_INPUT_TO", "WAITED_FOR"}]\n    assert flow_edges\n    assert all(edge.get("viewer_only") is True for edge in flow_edges)',
              '    raw_spawn = [edge for edge in edges if edge["source"] == ROOT and edge["relation"] == "SPAWNED_AGENT" and edge["target"] in {A1, A2, A3}]\n    assert len(raw_spawn) == 3\n    assert all(edge.get("viewer_flow_superseded") is True for edge in raw_spawn)\n    for node_id in ("model:55", "model:luna", "tool:spawn", "tool:send", "tool:wait"):\n        assert node_id in by_id\n        assert by_id[node_id]["attributes"]["viewer_flow_superseded"] is True\n    flow_edges = [edge for edge in edges if edge.get("viewer_only") is True and edge.get("relation") in {"MODEL_CONTEXT", "ORCHESTRATED_ACTION", "SPAWNED_AGENT", "SENT_INPUT_TO", "WAITED_FOR"}]\n    assert flow_edges\n    assert all(edge.get("viewer_only") is True for edge in flow_edges)',
          )

          replace_once(
              'src/execweave/dashboard_shell.py',
              'from .viewer_semantic_projection import project_provider_neutral_viewer_graph',
              'from .viewer_orchestration_projection import project_model_orchestration_viewer_graph',
          )
          replace_once(
              'src/execweave/dashboard_shell.py',
              '_viewer_projection_base.project_viewer_graph = project_provider_neutral_viewer_graph',
              '_viewer_projection_base.project_viewer_graph = project_model_orchestration_viewer_graph',
          )
          replace_once(
              'src/execweave/dashboard_shell.py',
              "  }else if(kind==='model'){\n    add('Model',node?.name);\n    add('Provider',a.provider||a.provider_name);\n    add('Inference calls',a.viewer_inference_count);\n    add('Inference history',execweaveInferenceHistory(a));\n  }else if(kind==='tool_call'){",
              "  }else if(kind==='model'||kind==='model_context'){\n    add('Model',node?.name);\n    add('Provider',a.provider||a.provider_name);\n    if(kind==='model_context'){add('Owner agent',a.owner_agent_id);add('Semantic model IDs',Array.isArray(a.semantic_model_ids)?a.semantic_model_ids.join(', '):a.semantic_model_ids)}\n    add('Inference calls',a.viewer_inference_count);\n    add('Inference history',execweaveInferenceHistory(a));\n  }else if(kind==='tool_action'){\n    add('Action',a.action_kind||node?.name);\n    add('Model context',a.model_name);\n    add('Owner agent',a.owner_agent_id);\n    add('Calls',a.call_count);\n  }else if(kind==='tool_call'){",
          )

          replace_once(
              'src/execweave/viewer_dashboard_clean.py',
              "  const allNodes=Array.isArray(data?.nodes)?data.nodes:[],allEdges=Array.isArray(data?.edges)?data.edges:[];",
              "  const allNodes=Array.isArray(data?.nodes)?data.nodes:[],allEdges=(Array.isArray(data?.edges)?data.edges:[]).filter(edge=>!edge?.viewer_flow_superseded);",
          )
          replace_once(
              'src/execweave/viewer_dashboard_clean.py',
              "  const internalStagingIds=new Set(allNodes.filter(node=>node&&internalStaging(node)).map(node=>node.id).filter(Boolean));\n  const hiddenIds=new Set([...hiddenDetailIds,...internalStagingIds]);",
              "  const internalStagingIds=new Set(allNodes.filter(node=>node&&internalStaging(node)).map(node=>node.id).filter(Boolean));\n  const flowSupersededIds=new Set(allNodes.filter(node=>node?.attributes?.viewer_flow_superseded===true).map(node=>node.id).filter(Boolean));\n  const hiddenIds=new Set([...hiddenDetailIds,...internalStagingIds,...flowSupersededIds]);",
          )

          replace_once(
              'src/execweave/live_view_readability.py',
              "  const put=(node,lane,order,y)=>spec.set(node.id,{lane,rank:EXECWEAVE_LANES[lane],order,x:laneX[lane],y});",
              "  const put=(node,lane,order,y)=>{const declared=Number(execweaveAttrs(node).viewer_flow_rank),rank=Number.isFinite(declared)?declared:EXECWEAVE_LANES[lane];spec.set(node.id,{lane,rank,order,x:laneX[lane],y})};",
          )
          replace_once(
              'src/execweave/live_view_readability.py',
              "  byLane.get('tool').sort((a,b)=>{\n    const ac=/spawn|send|wait|agent/i.test(String(a?.name||execweaveAttrs(a).tool_name||'')),bc=/spawn|send|wait|agent/i.test(String(b?.name||execweaveAttrs(b).tool_name||''));",
              "  byLane.get('tool').sort((a,b)=>{\n    const af=Number(execweaveAttrs(a).viewer_flow_first_sequence),bf=Number(execweaveAttrs(b).viewer_flow_first_sequence);\n    if(Number.isFinite(af)&&Number.isFinite(bf)&&af!==bf)return af-bf;\n    const ac=/spawn|send|wait|agent/i.test(String(a?.name||execweaveAttrs(a).tool_name||'')),bc=/spawn|send|wait|agent/i.test(String(b?.name||execweaveAttrs(b).tool_name||''));",
          )
          replace_once(
              'src/execweave/live_view_process_layout.py',
              "    const ids=[...topo.spec.keys()].filter(id=>topo.spec.get(id)?.lane===lane&&!isProcess(nodeById.get(id)));",
              "    const ids=[...topo.spec.keys()].filter(id=>{const node=nodeById.get(id),flowRank=Number(typeof execweaveAttrs==='function'?execweaveAttrs(node).viewer_flow_rank:NaN);return topo.spec.get(id)?.lane===lane&&!isProcess(node)&&!Number.isFinite(flowRank)});",
          )
          PY
      - name: Install focused test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate focused projection and static contracts
        run: |
          python -m ruff check src/execweave/viewer_orchestration_projection.py tests/test_orchestration_flow_projection.py src/execweave/dashboard_shell.py src/execweave/viewer_dashboard_clean.py src/execweave/live_view_readability.py src/execweave/live_view_process_layout.py
          python -m pytest -q tests/test_orchestration_flow_projection.py tests/test_dashboard_information_architecture.py tests/test_process_tree_layout.py tests/test_dashboard_simplification.py
      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/execweave/viewer_orchestration_projection.py tests/test_orchestration_flow_projection.py src/execweave/dashboard_shell.py src/execweave/viewer_dashboard_clean.py src/execweave/live_view_readability.py src/execweave/live_view_process_layout.py
          git commit -m "Wire model-scoped orchestration flow into dashboard layout"
          git push origin HEAD:feature/model-orchestration-flow
