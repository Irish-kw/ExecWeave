name: Provider Capability Stage Integrity

# No path filter. This job guards release red lines — the disabled CONNECT handler,
# the existing test set, the conversation completeness vocabulary, release metadata —
# so it must run on every pull request. A filter listing only the capability-probe
# files would arm the guard exactly when the guarded files are NOT the ones changing:
# a pull request that weakens http_proxy.py, deletes a test, or bumps the version
# while touching none of those paths would skip this job entirely.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Base commit or ref used to reconstruct baseline test node IDs
        required: true
        type: string

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Validate stage integrity
        run: >-
          python scripts/check_release_stage_integrity.py
          --baseline-ref "${{ github.event.pull_request.base.sha || inputs.baseline_ref }}"
          --allow-test-change "tests/multi_agent_run_fixture.py=v0.8.0 checks rounds in the browser, so the shared run fixture gains a second question and its answer. This module is the fixture builder and declares no test node IDs; nothing existing is removed"
          --allow-test-change "tests/test_agent_said_panel.py=v0.8.0 renders one round at a time, so the assertions that pinned the single Task/Thinking/Response call now pin the same three cards as they are built per round"
          --allow-test-change "tests/test_agent_topology_evidence.py=v0.8.0 splits record aggregation into a shared helper so the root's rounds are read across every record it owns; the same test ID still refuses a first-record fallback and now names the helper"
          --allow-test-change "tests/test_conversation_agent_focus.py=v0.8.0 appends a list of rounds rather than a single view; the same test IDs pin the selected-agent render path and the shared aggregation under their new names"
          --allow-test-change "tests/test_dashboard_information_architecture.py=v0.8.0 replaces rootFields/childFields with rootRounds/childRounds; the same test ID verifies the same per-agent projection under the round-aware names"
          --allow-test-change "tests/test_dashboard_simplification.py=v0.8.0 canonicalises file nodes by path alongside processes, so the assertion that pinned the canonical type set names both; the subject, that canonicalisation is presentation only, is unchanged and still asserted"
          --allow-test-change "tests/test_per_agent_conversation_default.py=v0.8.0 moves task and response selection inside a round window; the same test IDs pin sibling isolation and the absence of a first-record fallback against that code"
          --allow-test-change "tests/test_viewer_agent_isolation_e2e.py=v0.8.0 adds a browser check that each round keeps its own question and answer; the existing browser test IDs are unchanged in subject and still assert the visible contract"
