name: Provider Capability Stage Integrity

# No path filter. This job guards release red lines — the disabled CONNECT handler,
# the existing test set, the conversation completeness vocabulary, release metadata —
# so it must run on every pull request. A filter listing only the capability-probe
# files would arm the guard exactly when the guarded files are NOT the ones changing:
# a pull request that weakens http_proxy.py, deletes a test, or bumps the version
# while touching none of those paths would skip this job entirely.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Base commit or ref used to reconstruct baseline test node IDs
        required: true
        type: string

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Every --allow-test-change lives here on purpose: it names the file and the
      # reason in the workflow diff and in the job output, so editing an existing
      # test is never something that happens quietly. It cannot remove a test —
      # deletions and renames stay refused and the node-ID floor still requires
      # every baseline test to survive.
      - name: Validate stage integrity
        run: >-
          python scripts/check_release_stage_integrity.py
          --baseline-ref "${{ github.event.pull_request.base.sha || inputs.baseline_ref }}"
          --allow-test-change "tests/test_dashboard_information_architecture.py=the assertion pinned the colliding eight-character id fallback, which was the defect itself; the labels-are-provider-neutral subject is unchanged and still asserted"
          --allow-test-change "tests/test_agent_node_labels.py=the assertion required the unscoped conversation record fallback to label agents correctly; that fallback showed every agent every other agent's conversation and has been removed, so the test now asserts the stronger property that no such fallback exists"
