name: Provider Capability Stage Integrity

# No path filter. This job guards release red lines — the disabled CONNECT handler,
# the existing test set, the conversation completeness vocabulary, release metadata —
# so it must run on every pull request. A filter listing only the capability-probe
# files would arm the guard exactly when the guarded files are NOT the ones changing:
# a pull request that weakens http_proxy.py, deletes a test, or bumps the version
# while touching none of those paths would skip this job entirely.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Base commit or ref used to reconstruct baseline test node IDs
        required: true
        type: string

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Validate stage integrity
        run: >-
          python scripts/check_release_stage_integrity.py
          --baseline-ref "${{ github.event.pull_request.base.sha || inputs.baseline_ref }}"
          --allow-test-change "tests/multi_agent_run_fixture.py=v0.8.0 the browser check for folding needs a run with many distinct paths, so the shared fixture gains a files= knob. This module is the fixture builder and declares no test node IDs; nothing existing is removed"
          --allow-test-change "tests/test_conversation_agent_focus.py=v0.8.0 selection no longer stops at agents, so the two assertions that pinned the agent-only branch now pin the line that renders whatever node was clicked. The test IDs and their subject, that a click focuses the clicked node, are unchanged"
          --allow-test-change "tests/test_dashboard_information_architecture.py=v0.8.0 file joins process in the canonical set, so the two assertions naming that set name both types. The test IDs and the property they hold, that canonicalisation is presentation only, are unchanged"
          --allow-test-change "tests/test_dashboard_simplification.py=v0.8.0 the same canonical-set assertion names both types for the same reason; the raw-id check above it still proves the underlying graph keeps every node"
          --allow-test-change "tests/test_viewer_agent_isolation_e2e.py=v0.8.0 adds two browser checks: a non-agent node showing its own detail, and a crowded type folding its older members with every one still reachable. The existing browser test IDs are unchanged in subject and still assert the visible contract"
