name: Provider Capability Stage Integrity

# No path filter. This job guards release red lines — the disabled CONNECT handler,
# the existing test set, the conversation completeness vocabulary, release metadata —
# so it must run on every pull request. A filter listing only the capability-probe
# files would arm the guard exactly when the guarded files are NOT the ones changing:
# a pull request that weakens http_proxy.py, deletes a test, or bumps the version
# while touching none of those paths would skip this job entirely.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Base commit or ref used to reconstruct baseline test node IDs
        required: true
        type: string

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Validate stage integrity
        shell: bash
        env:
          BASELINE_REF: "${{ github.event.pull_request.base.sha || inputs.baseline_ref }}"
          HEAD_REF: "${{ github.head_ref }}"
        run: |
          args=(--baseline-ref "$BASELINE_REF")
          release_metadata_changed=""
          if git diff --name-only "$BASELINE_REF...HEAD" \
              | grep -qx 'tests/test_v069_dashboard_release.py'; then
            release_metadata_changed=yes
          fi
          if [[ "$HEAD_REF" == release/* && -n "$release_metadata_changed" ]]; then
            args+=(--allow-test-change "tests/test_v069_dashboard_release.py=release metadata assertions may advance only on a release/* pull request; the historical test name remains stable because the node-ID floor refuses renames")
          fi
          conversation_focus_changed=""
          if git diff --name-only "$BASELINE_REF...HEAD" \
              | grep -qx 'tests/test_conversation_agent_focus.py'; then
            conversation_focus_changed=yes
          fi
          if [[ "$HEAD_REF" == "release/0.8.3-graph-ergonomics" && -n "$conversation_focus_changed" ]]; then
            args+=(--allow-test-change "tests/test_conversation_agent_focus.py=PR #25 only: surfacing tool traffic appends one more card inside the same render pass, so the source assertion that pinned the final line names the new line. The test ID and subject are unchanged")
          fi
          conversation_identity_changed=""
          if git diff --name-only "$BASELINE_REF...HEAD" \
              | grep -qx 'tests/test_conversation_identity_merge.py'; then
            conversation_identity_changed=yes
          fi
          if [[ -n "$conversation_identity_changed" ]] \
              && { [[ "$HEAD_REF" == "fix/0.8.3-conversation-identity" ]] \
                   || [[ "$HEAD_REF" == "release/0.8.3-graph-ergonomics" ]]; }; then
            args+=(--allow-test-change "tests/test_conversation_identity_merge.py=AUD-001 only: the historical root-collision assertion is no longer correct after derived presentation thread ids stop acting as cross-execution identity; the original test node ID is retained and the assertion now requires isolation")
          fi
          model_runtime_identity_changed=""
          if git diff --name-only "$BASELINE_REF...HEAD" \
              | grep -qx 'tests/test_model_runtime.py'; then
            model_runtime_identity_changed=yes
          fi
          if [[ "$HEAD_REF" == "fix/0.8.3-inference-endpoint-identity" \
              && -n "$model_runtime_identity_changed" ]]; then
            args+=(--allow-test-change "tests/test_model_runtime.py=AUD-002 only: the historical llama.cpp request ID assertion now includes the sanitized endpoint scope; the test node ID and runtime privacy contract are unchanged")
          fi
          if [[ "$HEAD_REF" == "fix/provider-isolation" ]]; then
            while IFS= read -r path; do
              case "$path" in
                tests/test_viewer_projection.py)
                  args+=(--allow-test-change "tests/test_viewer_projection.py=non-loopback endpoints now fold into viewer-cluster:external; loopback stays separate. Test node ID is unchanged")
                  ;;
                tests/test_live.py)
                  args+=(--allow-test-change "tests/test_live.py=process-tree layout spreads a small depth Map into Math.max; coordinate arrays still must not be spread")
                  ;;
                tests/test_dashboard_simplification.py)
                  args+=(--allow-test-change "tests/test_dashboard_simplification.py=projected node set now contains External instead of the raw outbound IP")
                  ;;
                tests/test_codex_adapter.py)
                  args+=(--allow-test-change "tests/test_codex_adapter.py=apply_patch now declares explicit file targets so the graph preserves the tool-call-to-file relationship; existing test node IDs remain unchanged")
                  ;;
                tests/test_dashboard_ux_and_hook_projection.py)
                  args+=(--allow-test-change "tests/test_dashboard_ux_and_hook_projection.py=live graph projection folds the public endpoint; hook process remains hidden")
                  ;;
                tests/test_viewer_agent_isolation_e2e.py)
                  args+=(--allow-test-change "tests/test_viewer_agent_isolation_e2e.py=non-agent click target is External after IP collapse")
                  ;;
                tests/test_dashboard_readability_e2e.py)
                  args+=(--allow-test-change "tests/test_dashboard_readability_e2e.py=Dagre reflows existing nodes when a live node is added; identity of those nodes is unchanged")
                  ;;
                tests/test_pr25_premerge_hardening_e2e.py)
                  args+=(--allow-test-change "tests/test_pr25_premerge_hardening_e2e.py=Dagre LR placement replaces the old barycentre Y order; files stay to the right of owners and do not overlap")
                  ;;
                tests/test_per_agent_conversation_default.py)
                  args+=(--allow-test-change "tests/test_per_agent_conversation_default.py=isTask recipient/sender checks moved from viewer_agent_panel.py into viewer_agent_panel_default.py; historical test names are unchanged")
                  ;;
              esac
            done < <(git diff --name-only "$BASELINE_REF...HEAD" -- tests)
          fi
          if [[ "$HEAD_REF" == "fix/provider-history-aggregation" ]]; then
            while IFS= read -r path; do
              case "$path" in
                tests/test_antigravity_subagent_transcript_linkage.py)
                  args+=(--allow-test-change "$path=follow-up Antigravity spawn pairs now select the validated latest transcript pair while preserving the historical duplicate-pair abstention contract")
                  ;;
                tests/test_graph.py)
                  args+=(--allow-test-change "$path=semantic transcript replay is folded into one graph transition while raw evidence counts remain visible")
                  ;;
                tests/test_live_logs_export.py)
                  args+=(--allow-test-change "$path=raw event details now expose safe inspection actions for the event source and file target nodes")
                  ;;
                tests/test_provider_dashboard_contract.py)
                  args+=(--allow-test-change "$path=all providers now assert repeated result aggregation and semantic-only raw file evidence")
                  ;;
                tests/test_dashboard_information_architecture.py)
                  args+=(--allow-test-change "$path=runtime and semantic raw evidence now retain independent 320-row budgets, so the combined raw panel limit is 640")
                  ;;
                tests/test_viewer_agent_isolation_e2e.py)
                  args+=(--allow-test-change "$path=browser regressions now verify semantic-only md inspection and AGY follow-up conversation continuity")
                  ;;
              esac
            done < <(git diff --name-only "$BASELINE_REF...HEAD" -- tests)
          fi
          if [[ "$HEAD_REF" == "fix/dagre-routing-and-ports" ]]; then
            while IFS= read -r path; do
              case "$path" in
                tests/test_process_tree_layout.py)
                  args+=(--allow-test-change "$path=dagre now exposes route points and ports are recomputed after layout; historical test names remain stable")
                  ;;
                tests/test_graph_edge_routing_e2e.py)
                  args+=(--allow-test-change "$path=ordinary edges now use dagre polylines instead of cubics while bundle and lifecycle-return families stay deliberate exceptions")
                  ;;
              esac
            done < <(git diff --name-only "$BASELINE_REF...HEAD" -- tests)
          fi
          if [[ "$HEAD_REF" == "test/live-dashboard-acceptance" ]]; then
            while IFS= read -r path; do
              case "$path" in
                tests/test_command.py)
                  args+=(--allow-test-change "$path=acceptance branch isolates the historical Windows shim fallback from installed Cursor desktop candidates; native desktop preference and custom-install contracts remain separate and existing test node IDs are unchanged")
                  ;;
                tests/test_codex_adapter.py)
                  args+=(--allow-test-change "$path=Codex now documents Interrupt as a first-class hook with a bounded handler contract; the existing config test node ID is retained and now asserts the current official event and timeout semantics")
                  ;;
                tests/test_codex_hook_lifecycle.py)
                  args+=(--allow-test-change "$path=Codex now documents Interrupt as a first-class lifecycle event; the historical test node ID is retained while its assertion is corrected to the current official contract")
                  ;;
                tests/test_graph_clear_focus_e2e.py|tests/test_graph_edge_routing_e2e.py|tests/test_graph_node_sizing_e2e.py|tests/test_tool_traffic_e2e.py)
                  args+=(--allow-test-change "$path=existing browser assertions are unchanged; the module-level viewer_e2e marker makes the dedicated three-OS browser workflow collect tests that were previously omitted")
                  ;;
                tests/test_graph_lane_separation_e2e.py)
                  args+=(--allow-test-change "$path=layout acceptance separates endpoint projection from lane geometry using loopback fixtures and replaces obsolete fixed canvas coordinates with semantic lane/band invariants; historical test node IDs remain unchanged")
                  ;;
                tests/test_http_proxy.py)
                  args+=(--allow-test-change "$path=NEW-005 adds native streaming-order regressions for content-length and chunked responses; existing test assertions and node IDs are unchanged")
                  ;;
                tests/test_semantic.py)
                  args+=(--allow-test-change "$path=NEW-006 adds contradictory and future PID identity regressions through merge and graph materialization; existing test assertions and node IDs are unchanged")
                  ;;
              esac
            done < <(git diff --name-only "$BASELINE_REF...HEAD" -- tests)
          fi
          if [[ "$HEAD_REF" == "audit/remaining-providers-v0.8.7" ]]; then
            args+=(--allow-retired-provider "gemini=Gemini integration was retired and replaced by the AGY/Antigravity provider; only Gemini-owned test IDs and files may disappear")
            while IFS= read -r path; do
              case "$path" in
                tests/fixtures/hooks/manifest.json|tests/test_agent_bootstrap.py|tests/test_agent_topology_evidence.py|tests/test_agent_trace_viewer_visibility.py|tests/test_antigravity_agent_collaboration.py|tests/test_antigravity_child_transcript_tools.py|tests/test_antigravity_cursor_launch.py|tests/test_antigravity_identity_topology.py|tests/test_antigravity_invocation_archive.py|tests/test_antigravity_official_contract.py|tests/test_antigravity_subagent_transcript_linkage.py|tests/test_antigravity_trace_capability_cli.py|tests/test_claude_adapter.py|tests/test_codex_real_multi_agent_conversation.py|tests/test_collector.py|tests/test_command.py|tests/test_conversation_access.py|tests/test_conversation_agent_isolation.py|tests/test_conversation_identity_merge.py|tests/test_conversation_provider_parity.py|tests/test_cross_provider_agent_trace.py|tests/test_cursor_adapter.py|tests/test_dashboard_information_architecture.py|tests/test_external_endpoints_all_providers.py|tests/test_hook_fixture_corpus.py|tests/test_provider_capability.py|tests/test_provider_conversation_evidence.py|tests/test_provider_lifecycle.py|tests/test_v064_live_auto_integrations.py)
                  args+=(--allow-test-change "$path=Gemini provider retirement and provider-neutral AGY/dashboard contract updates are intentional on this branch; existing test node IDs remain stable where the provider is still supported")
                  ;;
              esac
            done < <(git diff --name-only "$BASELINE_REF...HEAD" -- tests)
          fi
          python scripts/check_release_stage_integrity.py "${args[@]}"
