name: Cleanup pre-v0.6.9 deployments

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-pre-v069-deployments.yml

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete deployments older than v0.6.9
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_VERSION: "0.6.9"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target = tuple(map(int, os.environ["TARGET_VERSION"].split(".")))
          target_tag = "v" + os.environ["TARGET_VERSION"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ExecWeave-deployment-cleanup",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {body}") from exc

          def get_all_deployments():
              deployments = []
              page = 1
              while True:
                  _, batch = request("GET", f"/deployments?per_page=100&page={page}")
                  deployments.extend(batch)
                  if len(batch) < 100:
                      return deployments
                  page += 1

          def parse_version(text):
              if not text:
                  return None
              text = text.removeprefix("refs/tags/").removeprefix("v")
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", text)
              return tuple(map(int, match.groups())) if match else None

          def resolve_tag_object(obj):
              current = obj
              for _ in range(4):
                  if current.get("type") == "commit":
                      return current["sha"]
                  if current.get("type") != "tag":
                      return current.get("sha")
                  _, tag = request("GET", f"/git/tags/{current['sha']}")
                  current = tag["object"]
              raise RuntimeError("annotated tag chain is unexpectedly deep")

          _, target_ref = request("GET", f"/git/ref/tags/{target_tag}")
          target_sha = resolve_tag_object(target_ref["object"])

          _, tag_refs = request("GET", "/git/matching-refs/tags/v0.6.")
          sha_to_version = {}
          for tag_ref in tag_refs:
              version = parse_version(tag_ref["ref"].split("/")[-1])
              if version is None:
                  continue
              commit_sha = resolve_tag_object(tag_ref["object"])
              sha_to_version[commit_sha] = version

          def deployment_version(deployment):
              by_ref = parse_version(deployment.get("ref"))
              if by_ref is not None:
                  return by_ref
              return sha_to_version.get(deployment.get("sha"))

          deployments = get_all_deployments()
          print(f"Found {len(deployments)} deployment(s).")
          for deployment in deployments:
              version = deployment_version(deployment)
              print(
                  f"  id={deployment['id']} environment={deployment.get('environment')!r} "
                  f"ref={deployment.get('ref')!r} sha={deployment.get('sha')} "
                  f"version={version} created_at={deployment.get('created_at')}"
              )

          current = [
              deployment
              for deployment in deployments
              if deployment_version(deployment) == target
              or deployment.get("ref") == target_tag
              or deployment.get("sha") == target_sha
          ]
          if not current:
              raise SystemExit(
                  f"Safety stop: no deployment belonging to {target_tag} ({target_sha}) was found. "
                  "Nothing was deleted."
              )

          old = [
              deployment
              for deployment in deployments
              if (version := deployment_version(deployment)) is not None and version < target
          ]
          unknown = [
              deployment
              for deployment in deployments
              if deployment_version(deployment) is None
          ]
          print(f"Keeping {len(current)} deployment(s) for {target_tag}.")
          print(f"Deleting {len(old)} deployment(s) older than {target_tag}.")
          if unknown:
              print(f"Leaving {len(unknown)} unversioned/unknown deployment(s) untouched.")

          deleted_ids = []
          for deployment in old:
              deployment_id = deployment["id"]
              version = deployment_version(deployment)
              print(f"Retiring deployment {deployment_id} for v{'.'.join(map(str, version))}...")
              request(
                  "POST",
                  f"/deployments/{deployment_id}/statuses",
                  {
                      "state": "inactive",
                      "description": f"Retired deployment before {target_tag}",
                  },
              )
              request("DELETE", f"/deployments/{deployment_id}")
              deleted_ids.append(deployment_id)

          remaining = get_all_deployments()
          remaining_old = [
              deployment
              for deployment in remaining
              if (version := deployment_version(deployment)) is not None and version < target
          ]
          remaining_current = [
              deployment
              for deployment in remaining
              if deployment_version(deployment) == target
              or deployment.get("ref") == target_tag
              or deployment.get("sha") == target_sha
          ]
          if remaining_old:
              raise SystemExit(f"Cleanup incomplete; old deployments remain: {[d['id'] for d in remaining_old]}")
          if not remaining_current:
              raise SystemExit(f"Safety failure: {target_tag} deployment disappeared")

          print(f"Deleted deployment IDs: {deleted_ids}")
          print(f"Remaining deployments: {len(remaining)}")
          print(f"Verified: {target_tag} deployment is preserved and no older versioned deployment remains.")
          PY
